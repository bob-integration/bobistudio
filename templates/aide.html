<template id="wiki-art-ptp-explique">
<p>PTP (IEEE 1588 / SMPTE 2059-2) synchronise les horloges pour aligner les RTP timestamps ST 2110.</p>
<div class="wiki-note">Pour l'horloge <strong>système</strong> des nœuds, la grille TAI du bus MXL et ce qui se passe à l'arrivée d'un nœud neuf, voir l'article <strong>Horloges du cluster (TAI)</strong>.</div>
<h2>Architecture (mode kernel)</h2>
<ul>
<li><code>ptp4l</code> tourne sur l'<strong>hôte du nœud</strong>, lié à la NIC PTP-capable</li>
<li><code>phc2sys</code> aligne <code>CLOCK_REALTIME</code> sur le PHC de la NIC</li>
<li>Les <strong>conteneurs</strong> héritent de l'horloge système de leur nœud (pas de time namespace)</li>
<li>Le rôle (master/slave/grandmaster) est déterminé automatiquement par BMCA</li>
</ul>
<div class="wiki-note"><strong>Par-nœud</strong> : la configuration PTP et le moniteur sont propres à chaque nœud. Réglages → <em>Nœuds &amp; Matériel → Réseau hôte → PTP</em>, avec le <strong>sélecteur de nœud</strong> ; l'échantillonneur suit l'état/historique de chaque nœud séparément.</div>
<h2>Paramètres SMPTE 2059-2</h2>
<p>Réglages → PTP expose les paramètres broadcast standard :</p>
<table>
<tr><th>Paramètre</th><th>Rôle</th><th>Défaut</th></tr>
<tr><td>Priority 1 / 2</td><td>Contrôle BMCA : valeur basse = préféré comme GM</td><td>128</td></tr>
<tr><td>logAnnounceInterval</td><td>Cadence des annonces (2^n s)</td><td>−2 (4/s)</td></tr>
<tr><td>logSyncInterval</td><td>Cadence des syncs</td><td>−3 (8/s)</td></tr>
<tr><td>UTC offset TAI</td><td>Requis par SMPTE 2059-2 pour convertir TAI→UTC</td><td>37 s</td></tr>
<tr><td>neighborPropDelayThresh</td><td>Seuil asymétrie lien (ns)</td><td>800 ns</td></tr>
</table>
<h2>Graphiques live</h2>
<p>L'onglet PTP affiche deux courbes canvas (offset master et mean path delay) sur 5 minutes. La courbe est verte quand l'horloge est verrouillée, orange sinon.</p>
<h2>Mode MTL (Intel E810)</h2>
<p>Avec une NIC E810 en mode MTL, ptp4l/phc2sys ne sont <strong>pas</strong> utilisés pour les conteneurs concernés — MTL gère le PTP directement via le PHC de la NIC avec une précision sub-100 ns.</p>
<div class="wiki-warn">ffmpeg (mode kernel) utilise <code>CLOCK_REALTIME</code>, pas le PHC directement. Précision = celle de phc2sys, sub-µs avec hardware timestamping (ConnectX-4+ ou E810).</div>
<div class="wiki-warn">ConnectX-3 et antérieurs : pas de hardware timestamping → offset en millisecondes, inutilisable pour du 2110 réel.</div>
</template>

<template id="wiki-art-horloges-cluster">
<p>Le bus MXL <strong>indexe ses grains sur le temps</strong> : <code>index = TAI ÷ durée du grain</code>, epoch SMPTE 2059-1. Deux nœuds qui ne tombent pas sur la même grille ne peuvent <strong>ni aligner leurs flux, ni se les répliquer</strong>. L'horloge n'est donc pas un détail d'exploitation, c'est une pièce du chemin média.</p>

<h2>La seule horloge qui compte</h2>
<p>libmxl ne lit qu'une chose : <code>CLOCK_TAI</code>. Et sous Linux :</p>
<pre>CLOCK_TAI = CLOCK_REALTIME + tai_offset (noyau)</pre>
<p>Le piège est là. <strong>Ni <code>systemd-timesyncd</code> ni <code>chrony</code> ne posent <code>tai_offset</code> d'eux-mêmes</strong> : laissé à 0, <code>CLOCK_TAI</code> vaut l'UTC, soit <strong>37 s d'écart</strong> avec la grille. Invisible tant qu'on ne regarde que l'heure civile, qui elle est juste.</p>

<h2>Deux conventions, toutes deux correctes</h2>
<table>
<tr><th>Type de nœud</th><th>CLOCK_REALTIME</th><th>tai_offset</th><th>Qui discipline</th></tr>
<tr><td>Porteur d'un moteur 2110</td><td>du <strong>TAI</strong></td><td>0</td><td>client PTP interne de libmtl, dans le moteur</td></tr>
<tr><td>Calcul / média</td><td>de l'<strong>UTC</strong></td><td>37</td><td>chrony + <code>leapseclist</code></td></tr>
</table>
<p>Les deux donnent le bon <code>CLOCK_TAI</code> par des routes opposées. On ne cherche donc pas à imposer une convention : on vérifie le <strong>résultat</strong>.</p>

<h2>Un nœud tout neuf qui arrive</h2>
<p><strong>Il arrive HORS GRILLE, dans les deux cas.</strong> Une Debian fraîche démarre avec <code>systemd-timesyncd</code> : l'heure civile est juste, <code>tai_offset</code> vaut 0, donc <code>CLOCK_TAI</code> vaut l'UTC. L'enrôlement ne touche pas au temps.</p>
<ul>
<li><strong>Sans 2110</strong> — il <em>reste</em> à 37 s tant que personne n'agit. Les symptômes ne nomment jamais l'horloge : ses flux paraissent <strong>périmés en permanence</strong> chez leurs consommateurs (l'âge apparent dépasse le seuil de 5 s, donc les lecteurs les déclarent morts et les rouvrent en boucle), et la <strong>réplication RDMA depuis ce nœud ne transporte rien</strong>. On cherche un problème de réseau ou de plugin pendant des heures.</li>
<li><strong>Avec 2110</strong> — il se répare tout seul, mais <em>seulement</em> quand le moteur tourne : c'est le client PTP de libmtl qui écrit du TAI dans l'horloge système. Entre l'enrôlement et le premier démarrage du moteur, le nœud est hors grille comme les autres. Ajouter l'entraînement du lien E810 (une à deux minutes) avant que le moteur ne produise.</li>
</ul>
<div class="wiki-note"><strong>À faire à l'enrôlement d'un nœud sans 2110 :</strong> Réglages → Réseau → <strong>Horloges</strong>, bouton <em>Mettre sur la grille</em>. Il installe chrony et pose <code>leapseclist</code>, qui maintient <code>tai_offset</code> tout seul, secondes intercalaires comprises. L'action est <strong>refusée</strong> sur un nœud dont <code>REALTIME</code> porte déjà du TAI : y ajouter chrony ferait battre deux disciplines sur la même horloge.</div>

<h2>Ce que la page Horloges sait dire, et ce qu'elle ne sait pas</h2>
<p>La sonde passe par l'agent de nœud en HTTP : l'instant du nœud n'est connu qu'à la <strong>demi-fenêtre d'aller-retour</strong> près, soit quelques dizaines de millisecondes. La colonne <em>Écart TAI</em> ne tranche donc qu'à la <strong>seconde</strong> — ce qui suffit largement à ce qu'elle vise : <code>tai_offset</code> oublié, source absente, convention incohérente, nœud injoignable.</p>
<p>L'accord au grain près ne se mesure <strong>pas</strong> ainsi. C'est la colonne <strong>précision locale</strong> qui porte le jugement fin : elle est relevée <em>sur</em> le nœud, sans aller-retour — offset rapporté par chrony, ou offset du client PTP du moteur pour un nœud 2110.</p>

<h2>Qui discipline quoi — et le piège du nœud 2110</h2>
<p>Sur un nœud de calcul, c'est <strong>chrony</strong> : il tient <code>CLOCK_REALTIME</code> sur l'UTC, et <code>leapseclist</code> pose <code>tai_offset</code>.</p>
<p>Sur un nœud <strong>2110</strong>, c'est <strong>libmtl, à l'intérieur du conteneur moteur</strong> : <code>ENGINE_PTP=libmtl</code> en fait un esclave PTPv2 sur le port DPDK, et <code>ENGINE_PHC2SYS=1</code> lui fait discipliner <code>CLOCK_REALTIME</code> depuis le PHC — en remplacement de <code>phc2sys</code> noyau, qui ne peut plus tourner puisque le port est sur vfio.</p>
<div class="wiki-note"><strong>Piège de diagnostic, déjà payé.</strong> Sur un nœud 2110, toutes les sondes de l'hôte annoncent « aucune horloge » : <code>systemctl</code> ne montre aucun service, <code>ps</code> aucun processus, <code>timedatectl</code> affiche <em>System clock synchronized: no</em> et le noyau garde <code>STA_UNSYNC</code> armé. <strong>C'est faux.</strong> Rien de tout cela n'est visible côté hôte parce que le discipliné vit dans un conteneur, et un programme qui pose l'heure ne se déclare pas comme démon de discipline. <strong>Toujours lire l'environnement du moteur avant de conclure</strong> — la colonne <em>Source de temps</em> de la page Horloges le fait pour vous et affiche le détail au survol.</div>
<p>Qualité constatée sur un moteur verrouillé : l'offset au grandmaster oscille à <strong>±50 ns</strong> autour de zéro, avec <code>synced: true</code>. Le <code>locked: false</code> que l'on peut lire à côté correspond au <em>lock strict</em> (chantier différé) et n'indique pas un défaut de synchronisation.</p>
<div class="wiki-note"><code>raw_delta_ns</code>, dans le bloc PTP du moteur, <strong>n'est pas un indicateur de dérive</strong> : c'est un instantané de diagnostic, figé entre deux relevés et variant par sauts non monotones. Ne pas y lire une tendance.</div>

<h2>Qui sert de référence — et pourquoi pas l'orchestrateur</h2>
<p>Les écarts sont exprimés <strong>par rapport au nœud le mieux tracé</strong> : un nœud verrouillé sur un grandmaster PTP passe avant un nœud NTP, qui passe avant un nœud sans source. Ce nœud porte la mention <em>référence</em> dans la colonne d'écart.</p>
<p>L'orchestrateur, lui, <strong>n'arbitre rien</strong>. C'est une machine NTP ordinaire : le prendre pour référence revenait à reporter sa propre dérive, à l'identique, sur toutes les lignes — au point de faire croire que tous les nœuds partaient ensemble alors que c'était le repère qui bougeait. Comme il sert d'intermédiaire à la mesure, son biais est <strong>commun à toutes les lignes</strong> et s'annule dès qu'on exprime les écarts entre nœuds.</p>
<p>Il a malgré tout <strong>sa ligne</strong> dans le tableau, parce qu'il fait partie du tableau des horloges du site et qu'on veut voir à quoi il est accroché. Mais il n'écrit aucun flux MXL : son horloge n'a pas à être sur la grille média, et la page ne lui applique donc aucun verdict de grille.</p>
<div class="wiki-note"><strong>La colonne <em>Source de temps</em> nomme la SOURCE, pas l'outil.</strong> « chrony » et « moteur 2110 » sont des outils ; ce qui compte est ce à quoi ils sont accrochés — l'adresse du serveur NTP et sa strate, ou l'identité du grandmaster PTP. L'outil et le moyen de discipline restent lisibles au survol.</div>

<h2>Écart, dérive, et ce que chacun vaut</h2>
<p>Deux grandeurs, à ne pas confondre :</p>
<ul>
<li>l'<strong>écart absolu</strong> porte un biais systématique (l'asymétrie de l'aller-retour vers l'agent) qu'on ne sait pas retirer — d'où le ± de plusieurs dizaines de millisecondes affiché à côté ;</li>
<li>la <strong>dérive</strong> est une <em>différence</em>, et ce biais étant à peu près constant, il s'y annule. Mesuré sur le parc, l'écart-type des relevés est de <strong>1 à 2 ms</strong> : cent fois mieux que la borne systématique.</li>
</ul>
<p>Autrement dit : <strong>une horloge qui part se voit</strong>, même si sa position exacte reste incertaine. C'est la colonne <em>Dérive</em> qu'il faut surveiller, pas l'écart. Elle reste muette tant que la fenêtre est trop courte (moins de dix points ou dix minutes) plutôt que d'annoncer une pente tirée du bruit.</p>
<div class="wiki-note"><strong>La dérive se mesure contre le RÉFÉRENT</strong>, pas contre l'orchestrateur. Sinon elle mesure le mauvais couple : chaque nœud paraissait s'éloigner d'une dizaine de millisecondes par heure alors que c'était le contrôleur, simple machine NTP, qui bougeait sous eux tous. Le référent, lui, ne « dérive » pas par rapport à la grille : il <em>est</em> la grille — sa ligne n'affiche donc pas de dérive, et sa qualité propre se lit dans la précision locale (l'offset au grandmaster).</div>
<div class="wiki-note"><strong>Si tous les nœuds dérivent dans le même sens et du même ordre</strong>, ce ne sont pas eux : c'est la <strong>référence</strong> qui bouge. Le contrôleur n'est qu'une machine NTP ordinaire, et sa propre dérive se retrouve à l'identique sur chaque ligne. La page le signale explicitement quand le cas se présente.</div>

<h2>Les seuils sont déduits du métier du nœud</h2>
<ul>
<li><strong>Nœud de calcul</strong> — son horloge ne sert qu'à tomber sur le <strong>même grain</strong> que ses pairs. Au-delà d'un <strong>demi-grain</strong>, il désigne l'image d'à côté : c'est là qu'est la limite. La cadence vient du <em>format vidéo par défaut</em>, plancher à 60 fps (entre 50 et 60 l'écart de demi-grain est mince, autant retenir le plus contraignant).</li>
<li><strong>Nœud portant un moteur 2110</strong> — il ne désigne pas des grains, il <strong>cadence des paquets</strong> sur le fil. C'est le modèle temporel ST 2110-21 qui commande, à la microseconde.</li>
</ul>
<p>Un seuil unique serait à la fois dix fois trop strict pour le calcul et des milliers de fois trop permissif pour le 2110. Le réglage de la page reste disponible comme <strong>remplacement explicite</strong> (0 = déduit).</p>

<h2>Pourquoi NTP suffit entre nœuds</h2>
<p>On ne propage pas le PTP d'un nœud à l'autre, et ce n'est pas un renoncement. La seule contrainte de temps <em>inter-nœuds</em> du plan MXL est de tomber sur le même grain — 20 ms à 50 fps — quand NTP tient la milliseconde. La précision PTP, elle, se consomme <strong>à l'intérieur</strong> du nœud 2110 (PHC de la NIC média → <code>media_ts</code> et pacing TX) et n'a aucune raison d'en sortir. La documentation du SDK MXL l'écrit noir sur blanc : pour du multi-hôtes, une source NTP traçable suffit. Propager créerait au contraire un point de panne unique, l'horloge du nœud 2110 n'existant que tant que son moteur tourne.</p>
<div class="wiki-note">Le jour où il faudra une phase <strong>trame-exacte</strong> entre nœuds, elle passera par le <strong>plan média</strong> (un flux de référence portant index et <code>media_ts</code>), pas par l'horloge système. Voir <code>docs/reference/PTP_CLOCK.md</code>.</div>
</template>


<template id="wiki-art-choix-serveur">
<p>Un nœud <strong>2110</strong> et un nœud de <strong>calcul</strong> ne demandent pas la même machine — et l'intuition courante se trompe sur les deux. Les chiffres ci-dessous sont <strong>mesurés</strong> sur la flotte (dl360 Gen10, Xeon Scalable), pas estimés.</p>

<h2>La règle en une phrase</h2>
<p>On n'achète <strong>pas de la vitesse de cœur</strong>. On achète de la <strong>disponibilité de cœur</strong> (pour le 2110) et de la <strong>bande passante mémoire</strong> (pour le calcul).</p>

<h2>Ce que consomme réellement un moteur 2110</h2>
<ul>
<li><strong>Cœurs : beaucoup, mais sobres.</strong> Les lcores DPDK tournent en <em>busy-poll</em> : ils occupent 100 % de leur cœur qu'il y ait du trafic ou non. On ne les réserve pas pour encaisser du débit, mais pour que <strong>rien ne s'intercale</strong> — une préemption au mauvais moment fait dépasser la fenêtre de réordonnancement et coince les sessions en cascade. Le nombre de lcores est dérivé du <strong>débit</strong> à traiter (≈ 1 cœur par slot 1080p50 non compressé), jamais de la fréquence.</li>
<li><strong>RAM : très peu.</strong> Le bus MXL n'est qu'un anneau de quelques trames. Mesuré sur un moteur en production à 25 flux : <code>/dev/shm/mxl</code> = <strong>490 Mo</strong>. Le vrai poste, ce sont les <strong>hugepages</strong> de DPDK (quelques Go).</li>
<li><strong>Bande passante mémoire : marginale.</strong> ≈ 3-4 Go/s pour déposer les trames RX en mémoire — négligeable devant les dizaines de Go/s d'un socket.</li>
<li><strong>PCIe :</strong> la carte 2110 (E810) et, si le nœud réplique vers d'autres nœuds, une <strong>seconde NIC RDMA</strong> (voir plus bas).</li>
</ul>
<div class="wiki-note">« Beaucoup de cœurs sobres », <strong>pas</strong> « des cœurs faibles » : chaque scheduler doit boucler plus vite que l'intervalle inter-paquets (≈ 200 000 paquets/s pour un seul flux 1080p50). Un cœur trop lent allonge la boucle — c'est le mécanisme exact d'un incident de 14 h en lab.</div>

<h2>Ce que consomme réellement le calcul (multiview, mélangeur, streamer…)</h2>
<p>Le bus MXL <strong>est</strong> de la RAM : chaque trame produite est écrite en mémoire, chaque consommateur la relit, chaque traitement la réécrit. La charge est donc <strong>bornée par la bande passante mémoire, pas par le CPU</strong>. Trois mesures concordantes :</p>
<ul>
<li>banc de charge multiview : <em>memory-bandwidth bound</em> (plafond dl360 ≈ 175 Go/s) ;</li>
<li>mélangeur passé de <strong>8 à 20 entrées</strong> : coût identique (3,3 % contre 3,45 % de CPU) ;</li>
<li>murs multiview en production : ils n'utilisent que <strong>23 %</strong> de leurs cœurs dédiés tout en tenant leurs 50 fps.</li>
</ul>
<p>Un cœur plus rapide ne fera qu'<strong>attendre la RAM plus vite</strong>. Ce qu'il faut maximiser, ce sont les <strong>canaux mémoire garnis</strong> — et assez de cœurs pour tenir l'échéance de trame (20 ms à 50p), quitte à ce qu'ils restent à 25 % : c'est <em>voulu</em>. Un cœur dédié utilisé à 90 % serait au bord du décrochage.</p>

<h2>Profils recommandés</h2>
<table>
<tr><th></th><th>Nœud 2110</th><th>Nœud de calcul</th></tr>
<tr><th>Cœurs</th><td>Nombreux (24-32), fréquence modérée</td><td>Assez pour les échéances ; la fréquence n'est pas le levier</td></tr>
<tr><th>RAM (capacité)</th><td><strong>Faible</strong> — 32 Go suffisent</td><td>Selon le nombre de conteneurs (le bus MXL reste petit)</td></tr>
<tr><th>RAM (bande passante)</th><td>Marginale</td><td>★ <strong>Le poste critique</strong> — garnir tous les canaux</td></tr>
<tr><th>Sockets</th><td>1 suffit</td><td>2 pour doubler la bande passante (pas les GHz)</td></tr>
<tr><th>NIC</th><td>E810 (2110) <strong>+ Mellanox (RDMA)</strong></td><td>Mellanox (RDMA)</td></tr>
</table>

<h2>RAM : capacité ≠ bande passante</h2>
<p>C'est la confusion la plus coûteuse. Le passage par la RAM est <strong>obligatoire</strong> (le moteur écrit ses flux RX dans le bus MXL local avant toute réplication RDMA), mais il ne demande <strong>presque aucune capacité</strong> :</p>
<pre>trame 1080p50 YUV420 8 bits ....... 3,1 Mo
anneau vidéo (8 trames) ........... 25 Mo par flux
25 flux RX + TX ................... ≈ 600 Mo   (mesuré : 490 Mo)</pre>
<p>Garnir de RAM le socket qui porte la carte 2110 « parce qu'il fait du 2110 » est de l'argent perdu. Le garnir parce qu'il porte <strong>aussi du calcul</strong> est justifié.</p>

<h2>Séparer les rôles : ce que ça implique</h2>
<p>Si le 2110 et le calcul vivent sur des machines différentes, les trames MXL doivent <strong>traverser le réseau</strong> — c'est le rôle du service <strong>RDMA</strong> (réplication MXL inter-nœuds, câblage inter-nœud transparent : on câble producteur→consommateur sur la page Câbles, le lien est provisionné sous le capot).</p>
<p>Le coût réseau est faible : un flux 1080p50 = <strong>1,24 Gb/s</strong> ; dix flux = 12 Gb/s. Du 25G passe sans effort.</p>
<div class="wiki-warn"><strong>Contrainte matérielle dure :</strong> sur E810, la RoCE est <strong>désactivée au runtime</strong> (devlink, pour l'AF-XDP du 2110). Un nœud 2110 ne peut donc <strong>pas</strong> faire son RDMA sur sa carte 2110 : il lui faut une <strong>seconde NIC dédiée</strong> (Mellanox).</div>

<h2>Piège vécu : un nœud ne peut pas être les deux</h2>
<p>Sur un dl360 à <strong>24 cœurs physiques</strong>, un moteur 2110 en consomme <strong>22</strong> (1 EAL + 16 lcores + cœurs de service). Il ne reste <strong>rien</strong> pour le calcul — et un mur multiview y tombe à 1,5 s par trame (pour un budget de 20 ms) sans qu'aucun code ne soit en cause. Le moteur n'est pas surdimensionné : il est <em>à sa taille</em> sur une machine trop petite.</p>
<p>Vérifier avant de déployer : <em>Monitoring</em> affiche la capacité en <strong>cœurs physiques</strong> et alerte quand un pool est sur-souscrit ou qu'un conteneur est en famine CPU (pression PSI, cadence non tenue).</p>

<h2>NUMA</h2>
<p>Sur une machine bi-socket, la carte 2110 est rattachée à <strong>un</strong> socket ; le moteur doit y être épinglé (c'est le cas par défaut). Un accès mémoire distant coûte <strong>×1,39 en latence</strong> (mesuré : 165 ns local, 240 ns distant). Comme MXL fait des copies <em>séquentielles</em> (la latence est masquée par le préchargement) et que les débits en jeu (~1,5 Go/s par mur) restent loin de la capacité du lien inter-socket, <strong>ce n'est pas un goulot démontré</strong> — c'est de l'hygiène, pas une urgence.</p>
</template>

<template id="wiki-art-cpu-pinning">
<p>Épingler un conteneur à des cores spécifiques réduit le cache thrashing et la gigue pour les workloads vidéo lourds (4K, multiview).</p>
<h2>Workflow</h2>
<ol>
<li>Configurer un conteneur → bloc "Ressources"</li>
<li>Champ "Épinglage CPU" : <code>4,5,6</code> ou <code>4-6</code> ou <code>4,7-9</code> (<code>--cpuset-cpus</code> Docker)</li>
<li>"Mettre à jour les ressources" → le conteneur redémarre avec la contrainte</li>
</ol>
<p>Vue globale <strong>par-nœud</strong> : Réglages → <em>Nœuds &amp; Matériel → CPU</em> — carte des cores du nœud sélectionné, avec assignation et conflits (deux conteneurs visant le même core sur le même nœud).</p>
<div class="wiki-note">Épinglage souple : le conteneur ne peut tourner que sur ces cores, mais l'hôte peut les utiliser aussi. Pour une réservation stricte, <code>isolcpus</code> dans la cmdline kernel — non implémenté.</div>
</template>

<template id="wiki-art-jeux-instructions">
<p>Une même image de conteneur doit tourner sur des processeurs de générations très différentes. Or le code compilé pour un CPU récent utilise des instructions que les anciens n'ont pas : lancé sur une vieille machine, il ne ralentit pas — il <strong>meurt</strong> sur une « instruction illégale ».</p>
<p>Les images <code>bobi-compute</code> et <code>bobi-media</code> embarquent donc <strong>deux versions de <code>libmxl</code></strong>, et c'est l'éditeur de liens du système qui choisit la bonne au démarrage de chaque conteneur, selon le processeur du nœud. Aucun réglage, aucune image par machine.</p>

<h2>Comment le choix se fait</h2>
<table>
<tr><th>Emplacement dans l'image</th><th>Compilée pour</th><th>Utilisée sur</th></tr>
<tr><td><code>/usr/local/lib/libmxl.so.1.1</code></td><td>x86-64-v2 (socle)</td><td>tout processeur, y compris antérieur à 2013</td></tr>
<tr><td><code>/usr/local/lib/glibc-hwcaps/x86-64-v3/libmxl.so.1.1</code></td><td>x86-64-v3 (AVX2, FMA, BMI2)</td><td>Haswell (2013) et au-delà</td></tr>
</table>
<p>Le mécanisme est <code>glibc-hwcaps</code>, standard depuis la glibc 2.33 : si le sous-dossier correspond aux capacités du CPU, la bibliothèque qu'il contient l'emporte ; sinon il est purement ignoré.</p>

<h2>Pourquoi deux versions plutôt qu'une</h2>
<p>Les deux réponses simples sont mauvaises, et la mesure le montre :</p>
<ul>
<li><strong>Tout compiler pour les CPU récents</strong> — c'était le cas avant. Les trois serveurs R620 (Sandy Bridge, 2012) du parc n'exécutaient <em>aucun</em> conteneur du pipeline : le script mourait en boucle et l'interface n'affichait qu'un « script arrêté » sans cause. Deux cartes Tesla T4 y étaient inutilisables.</li>
<li><strong>Tout compiler pour le socle</strong> — mesuré à charge identique, un conteneur <em>consommateur</em> (mixer, qui lit et réécrit le bus) coûte alors <strong>~20 % de CPU en plus</strong>. Un <em>producteur</em>, lui, ne perd que ~2 % : le compromis n'apparaît qu'en mesurant les deux régimes.</li>
</ul>

<h2>Où le voir</h2>
<p>La variante réellement chargée est <strong>constatée</strong> par nœud, en exécutant le chargeur — pas déduite des drapeaux du processeur. Elle apparaît dans le constat de placement (<code>GET /api/nodes/&lt;id&gt;/placement</code>, champ <code>mxl</code>) avec le chemin exact du fichier mappé.</p>
<div class="wiki-note"><strong>Une alerte veille dessus</strong> : un nœud dont le CPU sait faire de l'AVX2 mais qui charge quand même le socle est signalé. Sans ce contrôle, la bascule serait <em>invisible</em> — tout continuerait de fonctionner, simplement ~20 % plus lentement, et rien ne le dirait. Le cas n'est pas théorique : le binding Python liste des chemins absolus en dernier recours, et ceux-là court-circuitent la sélection.</div>

<h2>Conséquences pratiques</h2>
<ul>
<li>Un serveur ancien n'est plus exclu du parc : il tourne, un peu moins vite, et c'est <em>visible</em>.</li>
<li>Les <strong>outils</strong> livrés dans l'image (<code>mxl-info</code>, <code>mxl-fabrics-demo</code>) restent au socle : un exécutable ne bénéficie pas de ce mécanisme, réservé aux bibliothèques. Sans conséquence — la réplication RDMA est bornée par la carte réseau, pas par le processeur.</li>
<li>L'architecture visée est <strong>épinglée</strong> dans le Dockerfile, plus héritée de la machine qui construit : deux builds successifs donnent le même binaire, et on sait ce que contient l'image livrée.</li>
</ul>
</template>

<template id="wiki-art-mxl-format">
<p><strong>MXL</strong> (Media eXchange Layer, SDK Linux Foundation/EBU) est une bibliothèque d'échange média en <strong>mémoire partagée</strong> : des <em>flows</em> de <em>grains</em> (trames) dans un tmpfs, lecture/écriture <strong>zéro-copie</strong>, réveil des lecteurs par <strong>futex</strong> (au lieu d'un poll), récupération des flows morts (<strong>GC</strong>), et réplication inter-hôtes (<em>fabrics</em> RDMA). C'est la version standardisée de notre contrat shm maison.</p>
<p>Adoption <strong>progressive</strong>. La <strong>Phase 0</strong> (fondations) est faite : <code>libmxl</code> est buildée dans l'image <code>bobi-compute</code> et un binding Python ctypes <code>bobimxl.py</code> est fourni (<code>Writer</code>/<code>Reader</code>, <code>get_latest()</code> non-bloquant, <code>get()</code> futex, grain numpy zéro-copie). Tant que la migration des plugins (Phase 1) n'est pas lancée, libmxl/bobimxl sont <strong>présents mais inertes</strong>.</p>

<h2>Décision de format : payload <strong>planar</strong>, pas v210</h2>
<p>MXL v1.0.0 n'accepte en vidéo que <code>video/v210</code> / <code>video/v210a</code> (10-bit packed 4:2:2). Or nos plugins de traitement calculent sur du <strong>planar</strong> (samples adressables). Nous avons choisi d'ajouter à libmxl un type vidéo <strong>planar 10-bit</strong> via un petit patch local (~30 lignes dans <code>FlowParser::getPayloadSize()</code>, grain = somme des plans Y+Cb+Cr), et de proposer la modification en amont (PR). Comme on compile libmxl nous-mêmes (Dockerfile, <code>MXL_REF</code> épinglé), on n'attend pas le merge upstream.</p>

<h3>Pourquoi planar et pas v210</h3>
<p>Le v210 est <strong>bit-packed</strong> : on ne peut pas faire d'arithmétique pixel dessus (ni en numpy, ni en C) — il faut <strong>dé-packer puis re-packer</strong> à chaque étage. Sur ce système <strong>limité par la bande passante mémoire</strong>, cette conversion est du poids mort sur le goulot. Mesuré au banc (dl360, 1080p 4:2:2 10-bit, numpy) :</p>
<table>
<tr><th>Opération (par trame)</th><th>Coût</th><th>% du budget 50 fps (20 ms)</th></tr>
<tr><td><strong>Conversion v210 par étage</strong> (unpack + repack)</td><td><strong>33,0 ms</strong></td><td><strong>165 %</strong></td></tr>
<tr><td>— unpack v210 → planar</td><td>14,2 ms</td><td>71 %</td></tr>
<tr><td>— repack planar → v210</td><td>18,8 ms</td><td>94 %</td></tr>
<tr><td>Repère : blend planar (1 plan)</td><td>11,9 ms</td><td>60 %</td></tr>
<tr><td>Repère : memcpy d'une trame (plafond bus)</td><td>0,9 ms</td><td>4,5 %</td></tr>
<tr><td><strong>Planar (notre choix)</strong></td><td><strong>0 ms</strong></td><td><strong>0 %</strong></td></tr>
</table>
<div class="wiki-note"><strong>À retenir</strong> : en v210 bout-en-bout, un plugin dépasserait le budget 50 fps <em>rien qu'en convertissant</em> (33 ms &gt; 20 ms), avant tout traitement. Le planar supprime ce coût (≈ 33 ms économisés <em>par étage</em> de la chaîne).</div>

<h3>Interop : planar en interne, v210 aux frontières</h3>
<p>Le transport MXL est <strong>agnostique aux octets</strong> : le <code>media_type</code> ne sert qu'à dimensionner le grain et à l'interprétation par les outils. Donc le planar fonctionne <strong>partout dans notre cluster</strong> (tous les nœuds bobi se comprennent) et via les <em>fabrics</em> inter-nœuds. La conversion en v210 (ou ST 2110-20) n'est nécessaire qu'aux <strong>vraies frontières externes</strong> (consommateur MXL tiers, egress 2110) — et là seulement.</p>

<h3>Et plus tard ?</h3>
<p>Tout le pipeline est en <strong>10-bit</strong> (standard broadcast actuel). Le seul cas où v210 redeviendrait intéressant est un déport du calcul sur <strong>GPU</strong> (dé-package quasi gratuit, transfert PCIe plus petit) — c'est un chantier matériel séparé ; le patch planar se retire alors proprement.</p>
</template>

<template id="wiki-art-projets-raz">
<p>Un projet est un <strong>espace de travail</strong> : snapshot de la flotte (containers, câblage, réglages) chargeable et déchargeable. Les utilisateurs membres retrouvent leurs projets sur l'accueil (vues composables par widgets) ; un projet chargé est isolé des autres.</p>
<h2>Rappel de projet</h2>
<p>Page Projets → "Restaurer" : recrée tous les containers depuis le snapshot. Progression en direct (clonage → IP → agent → déploiement). Un container échoué n'interrompt pas les autres.</p>
<ul>
<li><strong>Réessayer les échecs</strong> : relance uniquement sur les containers ayant échoué</li>
<li><strong>Interrompre</strong> : stoppe entre deux containers</li>
<li>Les VMIDs déjà pris sont remappés automatiquement</li>
</ul>
<div class="wiki-note">Un conflit de hostname ou de SHM avec des containers existants bloque le rappel : détruire ou renommer les containers en conflit d'abord.</div>
<h2>RAZ</h2>
<p>Réglages → RAZ : liste les containers à supprimer (décochables), détruit en streaming avec confirmation à chaque étape. La suppression est vérifiée (status = stopped) avant le DELETE.</p>
</template>


<template id="wiki-art-mode-tranche">
<p>Le <strong>mode tranche</strong> réduit la latence de traversée : au lieu d'attendre une image complète à chaque étage, chaque étage publie et consomme l'image <strong>par bandes</strong> au fil de l'eau. Un étage interne coûte alors ~1 à 3 ms au lieu d'une image entière (20 ms en 50p).</p>
<h2>Activation</h2>
<ul>
<li><strong>Par container</strong> : opt-in via le paramètre <code>slice_mode</code> du container (défaut : désactivé — comportement historique inchangé).</li>
<li><strong>Tissu de composition</strong> (multiview composé) : réglage <code>fabric_slice_mode</code>.</li>
<li>Un consommateur non migré lit toujours des images complètes : la compatibilité est totale, chaque maillon peut être activé indépendamment.</li>
</ul>
<h2>Sorties 2110 : rythme d'émission</h2>
<p>Sur <strong>Destinations 2110</strong>, chaque sortie a un sélecteur de rythme d'émission :</p>
<ul>
<li><strong>⏱ Image suivante</strong> (défaut) : émission alignée sur l'horloge 2110 — interopérabilité stricte, mais une chaîne interne paie jusqu'à une image d'attente.</li>
<li><strong>⚡ Émission décalée +N ms</strong> : l'image part dès que ses premières bandes sont prêtes, N ms après le début du cycle. Le décalage (TROFF) est déclaré dans le SDP et l'horodatage RTP ne change pas : la synchro A/V du récepteur est préservée, il lui faut simplement une marge de tampon équivalente. Gain : ~une image de latence sur la sortie.</li>
</ul>
<div class="wiki-note">Les métriques <code>slice</code> de chaque container (waits, fallbacks, retard des sources) sont visibles sur son port 8080 et remontées en alertes quand une source est chroniquement en retard.</div>
</template>

<template id="wiki-art-hot-input">
<p>Recâbler l'entrée d'un container depuis la page Câbles se fait <strong>à chaud, sans coupure ni redéploiement</strong> si la nouvelle source a la même résolution.</p>
<table>
<tr><th>Type</th><th>Hot-input</th></tr>
<tr><td>Mélangeur, DVE, Correcteur</td><td>Toujours (rescale intégré)</td></tr>

<h2>Éditeur multiview — tout à chaud</h2>
<p>Depuis la version 0.8.0, l'éditeur multiview applique tous les changements en direct sur la sortie, sans redéploiement ni coupure :</p>

<li><strong>Ajouter / supprimer</strong> une source → reconfiguration atomique du multiview en direct ; la résolution source est auto-résolue</li>
<li><strong>Réglages par fenêtre</strong> (label, tally, VU-mètre, TSL index…) → appliqués sans coupure</li>
<li><strong>Réglages globaux</strong> (bordure, couleur, taille de texte, style de cadre…) → appliqués sans coupure</li>
</ul>
<p>Le bouton <em>Déployer</em> reste nécessaire uniquement pour changer la résolution de sortie, le FPS, le genlock ou le SHM de sortie.</p>

<template id="wiki-art-recette">
<p>La page <strong>Recette</strong> suit une campagne de vérification : une liste de points à
contrôler, un statut par point, et un <strong>fil de questions-réponses</strong> entre celui qui
développe et celui qui teste. Elle sert pendant la mise en service — brancher, vérifier, noter ce
qui cloche, répondre.</p>

<h2>Pourquoi elle existe</h2>
<p>Une campagne de recette vit d'habitude dans un tableur qui circule par courriel, et personne ne
sait quelle version fait foi. Ici, tout le monde voit la <strong>même liste en temps quasi réel</strong> :
le testeur pose une question sous le point concerné, le développeur répond au même endroit, et le
statut change sous les yeux des deux.</p>
<p>Chaque point porte trois choses : ce qu'il faut vérifier, <em>comment</em> le vérifier, et le
<strong>contexte</strong> — version d'image, conteneur concerné. Sans ce dernier, un « ça ne marche
pas » de la semaine dernière n'est plus interprétable.</p>

<h2>Statuts</h2>
<ul>
<li><strong>Non testé</strong> — l'état de départ. Un point non testé n'est pas un point qui marche.</li>
<li><strong>En cours</strong> — quelqu'un s'en occupe, on ne s'y met pas à deux.</li>
<li><strong>OK</strong> — vérifié, avec la remarque de qui l'a vérifié.</li>
<li><strong>Défaut</strong> — constaté ; le fil sous le point porte l'échange.</li>
</ul>

<h2>L'activer ou la masquer</h2>
<p><strong>Réglages → Système → Recette</strong> porte l'interrupteur. La page est
<strong>désactivée par défaut sur une installation neuve</strong> : passée la livraison, une entrée
de menu qui mène à une campagne vide encombre pour rien.</p>
<p>Désactivée, la page n'existe plus — elle répond 404, et l'entrée de menu disparaît au prochain
chargement. Les données, elles, restent : réactiver la retrouve intacte.</p>

<h2>Exporter</h2>
<p>Deux exports, et ce ne sont pas les mêmes pièces :</p>
<ul>
<li><strong>Le modèle</strong> — les points à vérifier, sans les résultats. C'est un plan de tests
réutilisable : on l'emporte sur une autre installation, on le remet à un intégrateur.</li>
<li><strong>La campagne complète</strong> — le modèle <em>plus</em> les résultats et les fils de
questions, donc les noms des testeurs et leurs remarques de terrain. C'est un
<strong>constat daté</strong>, la pièce qu'on joint à une livraison — pas quelque chose qui circule
par mégarde.</li>
</ul>
<p>Le nom du fichier le rappelle : <code>recette-modele-…</code> ou <code>recette-campagne-…</code>.</p>

<h2>Importer</h2>
<p><strong>Importer et fusionner</strong> ajoute les points absents et laisse le reste : un point
déjà présent n'est jamais écrasé. C'est le geste normal — reprendre un modèle, compléter une
campagne en cours.</p>
<p><strong>Importer en remplaçant</strong> efface d'abord tout : points, résultats, fils. Le suivi
ne garde <strong>aucun historique</strong>, donc l'action est sans retour — d'où la confirmation qui
le dit avant, et pas un message de regret après.</p>
<h2>Faire circuler questions et réponses</h2>
<p>C'est l'usage principal de l'export/import quand la recette tourne
<strong>chez un client</strong> : le testeur est sur site, celui qui répond ne l'est pas.</p>
<ol>
<li>sur site, le testeur pose ses questions sous les points concernés, puis
<strong>exporte la campagne complète</strong> ;</li>
<li>le fichier vous parvient par le moyen qui vous arrange — courriel, clé, dépôt partagé ;</li>
<li>vous l'importez chez vous, vous répondez dans les fils, vous corrigez les statuts, puis vous
<strong>réexportez</strong> ;</li>
<li>le site réimporte : vos réponses <strong>s'ajoutent</strong> à ses questions.</li>
</ol>
<p>La fusion est faite pour qu'<strong>aucun des deux côtés ne perde son travail</strong> :</p>
<ul>
<li>les <strong>fils</strong> se recousent message par message, par leur identifiant : une
conversation ne s'écrase jamais, les deux moitiés se rejoignent et se retrient par date ;</li>
<li>les <strong>statuts</strong> suivent la règle du plus récent, point par point : un statut n'a
qu'une valeur, et c'est le dernier qui a regardé qui fait foi.</li>
</ul>
<p>Aucun réseau n'est nécessaire entre les deux installations — ce qui compte sur un réseau de
production isolé, où le contrôleur ne sort pas.</p>

<p>Un point importé n'hérite jamais du drapeau « intégré » : ce marquage désigne les points qui
viennent du code de <em>cette</em> installation et que le démarrage réinjecte. L'hériter d'un
fichier rendrait le point indestructible sur la machine qui l'importe.</p>

<h2>Où vivent les données</h2>
<p>Dans <code>db_testplan.json</code>, à côté de la base — un fichier à part, jamais versionné et
jamais publié. Il n'entre dans aucune sauvegarde de projet : une recette est un constat sur une
installation, pas un état de la flotte.</p>
</template>

<template id="wiki-art-depannage">
<h2>Multiview ne voit pas le shm du receiver</h2>
<pre>ssh root@&lt;proxmox-host&gt; "grep dev/shm /etc/pve/lxc/&lt;vmid&gt;.conf"</pre>
<p>Doit retourner <code>lxc.mount.entry: /dev/shm dev/shm none bind,create=dir 0 0</code>. Sinon recréer le container.</p>
<h2>PermissionError sur /dev/shm/mxl_*</h2>
<p>Fichiers fantômes UID 100000 d'anciens containers unprivileged :</p>
<pre>ssh root@&lt;proxmox-host&gt; "rm -f /dev/shm/mxl_*"</pre>
<h2>Receivers NMOS invisibles côté VSM</h2>
<ul>
<li>Vérifier <code>nmos_receivers_count &gt; 0</code> sur le container</li>
<li>Si <code>nmos_registry_url</code> est vide, VSM doit utiliser mDNS</li>
</ul>
<h2>PTP non locked</h2>
<ul>
<li>Vérifier que <code>ptp_ifname</code> voit le grandmaster</li>
<li>Sans hardware timestamping : offset en millisecondes, inutilisable pour 2110 réel</li>
</ul>
<h2>Alerte "SSH vers l'host Proxmox a échoué"</h2>
<p>Test : <code>ssh -o BatchMode=yes -o ConnectTimeout=5 root@&lt;proxmox-host&gt; "echo OK"</code>. Causes courantes : clé absente, non autorisée, host injoignable.</p>
<pre>ssh-keygen -t ed25519 -f /root/.ssh/id_ed25519 -N ""
ssh-copy-id root@&lt;proxmox-host&gt;</pre>
</template>

<template id="wiki-art-snmp-supervision">
<h2>Brancher votre supervision (SNMP)</h2>
<p>Bobi.Studio expose l'état du <strong>cluster entier</strong> à un système de supervision (NMS)
   par SNMPv3 : santé des nœuds, synchronisation PTP, état des flux ST 2110, conteneurs et alarmes
   en cours. <strong>Un seul point d'interrogation</strong> — le contrôleur actif — parce que la
   donnée de tous les nœuds y est déjà agrégée. Il n'y a rien à installer sur les nœuds.</p>

<h3>En cinq minutes</h3>
<ol>
<li>Ouvrez <strong>Réglages → Protocoles → SNMP</strong> (si l'onglet n'apparaît pas, activez
    d'abord le service SNMP dans la liste des services).</li>
<li>Choisissez un <strong>nom d'utilisateur</strong> et <strong>deux mots de passe différents</strong>
    d'au moins 8 caractères — un pour l'authentification, un pour le chiffrement. Ils ne sont
    jamais réaffichés ensuite.</li>
<li>Activez l'agent et enregistrez. La page affiche alors <strong>l'engine ID</strong> et une
    <strong>ligne de commande prête à copier</strong>.</li>
<li>Cliquez sur <strong>Télécharger la MIB</strong> et chargez le fichier dans votre NMS
    (Centreon, Zabbix, PRTG, LibreNMS…). C'est lui qui donne un nom lisible à chaque valeur.</li>
<li>Vérifiez depuis un poste tiers en collant la ligne de commande affichée, avec vos mots de
    passe à la place des repères.</li>
</ol>
<p><a class="btn btn-blue" href="/api/snmp/mib" download>Télécharger BOBI-STUDIO-MIB.mib</a></p>

<h3>Recevoir les alarmes sans interroger</h3>
<p>L'interrogation périodique donne l'état ; les <strong>notifications</strong> préviennent
   immédiatement. Elles se configurent ailleurs, dans
   <strong>Réglages → Alertes → Canal SNMP</strong> : c'est le même moteur de décision que les
   e-mails et le syslog (seuil, anti-tempête, état des envois), avec SNMP comme simple canal
   de sortie.</p>
<div class="wiki-note"><strong>Laissez « Inform » plutôt que « Trap »</strong> : un inform est
   <em>acquitté</em>, donc une notification perdue se voit dans l'état des envois. Un trap ne
   l'est pas — sa perte est silencieuse. Si votre NMS n'accepte que les traps, il devra connaître
   notre <strong>engine ID</strong> (affiché par la page dès que « trap » est choisi) : sans ce
   provisionnement, il jette les traps sans un mot pendant que l'envoi se déclare réussi.</div>

<h3>Trois choses à savoir avant d'écrire vos règles</h3>
<ul>
<li><strong>N'alarmez pas sur <code>bsPtpLocked</code></strong>, mais sur <code>bsPtpSynced</code>.
    Les deux ne disent pas la même chose : <code>bsPtpSynced</code> répond « il y a une référence
    de temps » (disponibilité), <code>bsPtpLocked</code> répond « le servo est convergé sous
    100 ns » (qualité). Une alarme de disponibilité doit donc porter sur le premier : au démarrage
    d'un moteur, le servo met une à deux minutes à converger, et une règle sur
    <code>bsPtpLocked</code> sonnerait à chaque déploiement. Gardez le second pour une règle de
    qualité, avec une temporisation.</li>
<li><strong>Lisez toujours la colonne <code>…Age</code></strong> à côté d'une valeur. Sans elle,
    une panne de <em>collecte</em> se lit exactement comme une panne de <em>production</em>.</li>
<li><strong>Corrélez sur les numéros d'emplacement</strong> (<code>bsAlarmRoleNum</code>,
    <code>bsFlowRoleNum</code>) et non sur les identifiants de conteneur : ces derniers sont
    réattribués quand un conteneur est recréé, et votre règle finirait par désigner autre
    chose.</li>
</ul>

<div class="wiki-warn"><strong>Si vous aviez chargé une version antérieure de la MIB</strong> :
   le numéro d'entreprise IANA de BOBI a été attribué le 2026-08-26 (66633). L'arbre était
   auparavant publié sous un arc réservé provisoire — <strong>tout a changé d'adresse</strong>, et
   l'engine ID a été régénéré. Rechargez la MIB et re-provisionnez les identifiants côté NMS.</div>

<template id="wiki-art-rdma-replication">
<p>La <strong>réplication RDMA</strong> transporte un flux MXL produit sur un nœud jusqu'au domaine MXL d'un autre nœud, sans repasser par ST 2110. On ne la pilote presque jamais directement : câbler un producteur d'un nœud vers un consommateur d'un autre nœud, sur la page <strong>Câbles</strong>, provisionne le lien sous le capot. Cet article explique ce qui se passe dessous, et surtout <strong>comment obtenir plus de 10 Gb/s</strong> quand un seul port ne suffit plus.</p>

<div class="wiki-note">Réglages → <em>Nœuds &amp; Matériel → RDMA</em> pour l'activation, les liens et les chemins. Monitoring → onglet <em>RDMA</em> pour les débits mesurés par interface.</div>

<h2>Pré-requis matériel</h2>
<ul>
<li>Une NIC <strong>RoCE</strong> (Mellanox ConnectX) sur chaque nœud concerné, déclarée en rôle <code>rdma</code> dans Réglages → <em>Nœuds &amp; Matériel → Réseau hôte</em>, avec une IP.</li>
<li>Un nœud 2110 ne peut <strong>pas</strong> faire son RDMA sur sa carte E810 : la RoCE y est désactivée au runtime pour l'AF-XDP. Il lui faut une seconde NIC dédiée.</li>
<li>Les deux nœuds doivent partager un <strong>sous-réseau</strong> sur leurs interfaces <code>rdma</code>.</li>
</ul>

<h2>Passer à plusieurs ports : ce qui ne marche pas</h2>
<p>Quand un port sature, le réflexe est d'agréger deux liens physiques en LACP. <strong>Ça ne donnera rien.</strong> Deux raisons indépendantes :</p>
<ul>
<li>En RoCE, une connexion (une <em>QP</em>) reste sur <strong>un seul port</strong>. Même avec un bond parfait, une réplication donnée ne dépassera jamais le débit d'un port.</li>
<li>Le <em>RoCE-over-LAG</em>, qui fusionne deux ports en un device verbs unique, est une fonction des <strong>ConnectX-4 et au-delà</strong>. Sur une ConnectX-3, un <code>bond0</code> Linux donne un lien IP agrégé et un RDMA qui continue de sortir par un seul port.</li>
</ul>

<h2>Ce qui marche : distribuer les liens</h2>
<p>L'agrégat s'obtient en répartissant les <strong>liens</strong> entre plusieurs <strong>chemins</strong>. Un chemin = une paire de ports partageant un sous-réseau. Chaque lien reçoit son chemin à sa création, sur le moins chargé du moment.</p>

<div class="wiki-warn"><strong>Un sous-réseau distinct par chemin, impérativement.</strong> Deux ports d'un même nœud sur le même sous-réseau, et c'est le modèle « weak host » de Linux qui décide : l'ARP répond par n'importe quel port, le pair apprend la mauvaise MAC, et tout ressort par un seul fil. Deux ports actifs, aucune erreur, la moitié de la bande passante perdue. Exemple d'adressage sain : <code>192.168.1.0/24</code> pour le chemin 1, <code>192.168.2.0/24</code> pour le chemin 2.</div>

<p>Le durcissement ARP correspondant (<code>arp_ignore=1</code>, <code>arp_announce=2</code>) est posé automatiquement à l'installation du nœud et rejoué à chaque établissement de lien — rien à faire à la main, y compris après un ré-enrôlement.</p>

<h3>La charge est une estimation, pas une mesure</h3>
<p>La répartition raisonne sur le débit <strong>déduit du format</strong> de chaque flux (résolution, cadence, profondeur, chroma), et non sur le trafic observé. C'est volontaire : au moment où un lien est créé, il ne transporte encore rien. Un lien dont le format n'est pas encore connu compte pour une valeur forfaitaire, réglable (<code>rdma_default_flow_gbps</code>), et sera recalé au ré-établissement suivant.</p>

<p>La comptabilité est <strong>orientée</strong> : l'Ethernet étant full-duplex, l'aller et le retour d'un même port sont deux budgets indépendants. Saturer un sens n'interdit pas l'autre.</p>

<h2>Câblage inter-nœud : le lien se crée tout seul</h2>
<p>On ne crée presque jamais un lien à la main. Câbler, sur la page <strong>Câbles</strong>, un
producteur d'un nœud vers un consommateur d'un <em>autre</em> nœud provisionne la réplication sous
le capot — le flux n'existant pas dans le domaine MXL du consommateur, il faut bien l'y amener.</p>
<p>Une <strong>réconciliation</strong> tourne en fond (toutes les 30 s) et rattrape les câbles
inter-nœuds dépourvus de lien. Elle existe parce que le provisionnement à la pose ne suffisait pas :
tous les câbles ne passent pas par le même chemin de code — composeur multiview, restauration de
snapshot, câblages antérieurs à la fonctionnalité — et ceux-là n'obtenaient rien. Le symptôme était
muet : le câble était affiché, la page annonçait « RDMA », et le consommateur lisait un flux absent
de son propre nœud.</p>
<ul>
<li>Elle ne contourne <strong>pas</strong> l'interrupteur : service désactivé, aucune création.</li>
<li>Un lien existant compte <strong>quel que soit son statut</strong> — réparer un lien en erreur
est le travail de la réconciliation d'état, pas de celle-ci.</li>
<li>Elle crée au plus <strong>4 liens par passe</strong> : chaque lien, ce sont deux conteneurs de
réplication à démarrer. La passe suivante prend la suite.</li>
<li>Un flux que <strong>personne ne produit</strong> est ignoré : câbler vers un flux inexistant est
un problème de câblage, et lui inventer un lien le masquerait.</li>
</ul>
<p>Chaque création lève une alerte, pour que le rattrapage ne soit pas silencieux non plus.</p>

<div class="wiki-note">Sur la page Câbles, un câble inter-nœud porte la mention <strong>RDMA</strong>
quand sa réplication tourne, <strong>RDMA …</strong> pendant l'établissement, et
<strong>RDMA ABSENT</strong> en rouge quand aucun lien ne le transporte. Cette dernière ne devrait
plus apparaître que fugitivement, le temps que la réconciliation passe.</div>

<h2>Ajouter un port à une installation en service</h2>
<p>L'affectation se fait à la création du lien. Câbler une seconde interface ne déplace donc <strong>rien</strong> par lui-même : les liens en place gardent leur chemin et le nouveau port reste à zéro. Marche à suivre :</p>
<ol>
<li>Câbler le second port, des deux côtés.</li>
<li>Le déclarer en rôle <code>rdma</code> sur chaque nœud, avec une IP dans un <strong>nouveau</strong> sous-réseau.</li>
<li>Réglages → <em>Nœuds &amp; Matériel → RDMA</em> → section <strong>Chemins</strong> : le nouveau chemin doit apparaître, à 0 lien.</li>
<li><strong>Simuler un rééquilibrage</strong>. La simulation liste les liens à déplacer et la charge résultante par chemin ; rien n'est modifié tant qu'on n'a pas confirmé.</li>
<li>Confirmer. Les liens déplacés sont ré-établis, ce qui implique une <strong>coupure brève</strong> de leur réplication — à faire en fenêtre de maintenance si les flux sont à l'antenne.</li>
</ol>

<h2>Panne d'un chemin : bascule automatique</h2>
<p>Quand un port tombe — câble débranché, transceiver mort, port de switch en panne — les liens qui
l'empruntaient sont <strong>déplacés sur le chemin survivant</strong>, le moins chargé. Sans ça,
deux ports agrégés donnent de l'agrégat mais aucune redondance : l'adresse d'un lien étant figée à
sa création, les liens retenteraient indéfiniment sur un fil mort pendant que l'autre chemin a de la
place.</p>
<p>Un chemin n'est déclaré mort que sur <strong>preuve positive</strong> : ses deux ports doivent
être relevés et l'un d'eux non-ACTIVE. Un nœud dont le relevé de santé manque — sonde pas encore
passée, hôte injoignable — n'est jamais lu comme « ports morts », sans quoi une panne de supervision
provoquerait une vraie coupure.</p>

<div class="wiki-warn"><strong>On bascule à la panne, on ne revient pas tout seul.</strong> Déplacer
un lien déjà cassé ne peut que l'améliorer. Le ramener sur son chemin d'origine, à l'inverse,
casserait un lien qui fonctionne pour un simple gain d'équilibrage. Au retour du port, une alerte
signale que les liens sont restés sur leur chemin de secours : c'est au <strong>rééquilibrage
manuel</strong> de les répartir, lui qui annonce sa coupure avant de l'infliger.</div>

<h2>Surveillance de la capacité</h2>
<p>Un chemin qui dépasse sa capacité lève une alerte, <strong>à la transition</strong> et non à
chaque passage — et une seconde, informative, quand il repasse dessous. Le contrôle a lieu à chaque
passe de réconciliation, pas seulement à la création d'un lien : la charge bouge sans qu'aucun lien
soit créé, par exemple lorsqu'un format grossit sous des liens déjà placés, après une bascule de
chemin, ou quand la réconciliation crée des liens d'elle-même.</p>

<h2>Vérifier que ça répartit vraiment</h2>
<p>C'est le point le plus important, parce qu'une répartition morte ne ressemble à rien d'anormal. Monitoring → onglet <strong>RDMA</strong> ventile le débit <strong>par interface</strong> :</p>
<ul>
<li>Un total de 6 Gb/s sur une capacité de 20 peut être <strong>6+0</strong> (répartition morte) ou <strong>3+3</strong> (répartition vivante). Le total seul ne les distingue pas.</li>
<li>Un port qui reste à zéro <em>pendant qu'un autre port du même nœud travaille</em> est marqué « aucun trafic ». C'est le symptôme à chercher.</li>
<li>La capacité affichée d'un nœud est la <strong>somme</strong> de ses ports.</li>
</ul>

<h2>Diagnostic</h2>
<ul>
<li><strong>Le nouveau chemin n'apparaît pas dans Chemins</strong> — les deux nœuds n'ont pas de sous-réseau commun sur leurs interfaces <code>rdma</code>. Vérifier les IP déclarées des deux côtés.</li>
<li><strong>« Aucun chemin »</strong> — un seul port <code>rdma</code> par nœud : il n'y a rien à répartir, c'est normal.</li>
<li><strong>Deux interfaces partagent le sous-réseau X</strong> (avertissement dans l'onglet) — voir l'encadré plus haut : un seul port transportera. Donner un sous-réseau distinct à chacun.</li>
<li><strong>Une interface porte une adresse recouvrant le sous-réseau d'une autre</strong> — une adresse secondaire aussi spécifique que celle du port légitime peut capter son trafic. Une adresse <em>moins</em> spécifique (un <code>/16</code> à côté d'un <code>/24</code>) est inoffensive : le noyau route au préfixe le plus long.</li>
<li><strong>Un lien reste « en attente »</strong> — le flux source n'est pas (encore) produit. Ce n'est pas une erreur RDMA ; le lien s'établira dès que le producteur démarre.</li>
<li><strong>Aucun lien audio ni ANC alors que la page Câbles montre ces ports</strong> — un port déclaré n'est pas un flux produit. Vérifier le <strong>voyant de signal</strong> du port sur la page Câbles (cf. article <em>Page Câbles</em>) : éteint, il n'y a rien à répliquer, et le RDMA n'y est pour rien. Sur un moteur 2110, les sorties audio et ANC restent éteintes tant qu'aucun receiver 2110-30 ou 2110-40 n'est abonné en IS-05.</li>
<li><strong>Un câble marqué « RDMA ABSENT »</strong> — le câble relie deux nœuds mais aucun lien ne transporte son flux : le consommateur lit un flux qui n'existe pas chez lui. La réconciliation le provisionne dans les 30 s ; si la mention persiste, c'est que la création échoue (voir les alertes) ou que le service RDMA est désactivé.</li>
<li><strong>Un lien ne transporte rien alors que tout est « running »</strong> — vérifier l'horloge du nœud source : un nœud hors grille TAI produit des flux que la cible refuse d'indexer. Voir l'article <strong>Horloges du cluster (TAI)</strong>.</li>
</ul>

<h2>Dimensionner</h2>
<p>Un ordre de grandeur utile, en 4:2:2 non compressé : un 1080p50 pèse environ <strong>1,7 Gb/s</strong> en 8 bits et <strong>2,1 Gb/s</strong> en 10 bits. Six flux 1080p50 8 bits saturent donc un port 10 Gb/s, et le passage en 10 bits impose de répartir.</p>

<div class="wiki-note"><strong>Recommandation</strong> : pour une installation neuve, préférer <strong>un seul port RDMA correctement dimensionné</strong> (25 Gb/s) à deux ports agrégés. Le multi-port reste disponible pour les machines dont la carte n'est pas remplaçable, mais chaque diagnostic ultérieur devra se demander par quel chemin passe un lien donné.</div>

];

const CATEGORIES = [
  { id: 'start',      label: 'Démarrage' },
  { id: 'prereq',     label: 'Pré-requis' },

  { id: 'about',      label: 'À propos' },

// ── State ─────────────────────────────────────────────────────────────────
let allArticles = [...CORE_ARTICLES];   // core + plugin articles merged
let searchIndex = [];                   // [{id, title, cat, catLabel, text}]
let currentId   = null;
let history_    = [];
let collapsedCats = new Set();          // ids des catégories repliées
let tocObserver = null;                 // IntersectionObserver du scroll-spy TOC

// ── DOM refs ──────────────────────────────────────────────────────────────
const navEl     = document.getElementById('wiki-nav');
const contentEl = document.getElementById('wiki-content');
const searchEl  = document.getElementById('wiki-search');
const kbdEl     = document.getElementById('wiki-search-kbd');

// ── Utilitaires ───────────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function stripHtml(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return d.textContent || '';
}

function catLabel(catId){
  return (CATEGORIES.find(c => c.id === catId)||{}).label || catId;
}

// ── Charger les articles plugins ──────────────────────────────────────────
async function loadPluginArticles(){
  try {
    const r = await fetch('/api/plugins/help');
    if (!r.ok) return;
    const plugins = await r.json();
    const pluginCatMap = { sources:'sources', traitements:'traitements',
                           medias:'medias', streams:'streams', destinations:'destinations' };
    for (const p of plugins) {
      const cat = pluginCatMap[p.category] || p.category;
      allArticles.push({
        id: 'plugin-' + p.type,
        title: p.label,
        cat: cat,
        version: p.version,
        html: p.html,
        isPlugin: true,
        // Langue RÉELLEMENT servie par le plugin ("" = fichier générique).
        docLang: p.lang || '',
      });
    }
  } catch(e) {}
  buildIndex();
  renderNav();
  // Naviguer vers l'article courant (si URL hash pointe vers un plugin)
  const hash = location.hash.slice(1);
  if (hash && allArticles.find(a => a.id === hash)) {
    navigate(hash, false);
  }
}

// ── Construire l'index de recherche ──────────────────────────────────────
function buildIndex(){
  searchIndex = allArticles.map(a => {
    const raw = a.html ? stripHtml(a.html)
                       : stripHtml((document.getElementById('wiki-art-' + a.id)||{}).innerHTML || '');
    return { id: a.id, title: a.title, cat: a.cat, catLabel: catLabel(a.cat), text: raw };
  });
}

// ── Rendu du nav ─────────────────────────────────────────────────────────
function renderNav(){
  const catOrder = CATEGORIES.map(c => c.id);
  const bycat = {};
  for (const a of allArticles) {
    if (!bycat[a.cat]) bycat[a.cat] = [];
    bycat[a.cat].push(a);
  }
  // Trier les catégories selon CATEGORIES order, puis les inconnues
  const keys = [...new Set([...catOrder, ...Object.keys(bycat)])].filter(k => bycat[k]);
  // Catégorie de l'article courant (toujours dépliée)
  const activeCat = (allArticles.find(a => a.id === currentId) || {}).cat;
  let html = '';
  for (const k of keys) {
    const collapsed = collapsedCats.has(k) && k !== activeCat;
    const items = bycat[k];
    html += `<div class="wiki-cat${collapsed ? ' collapsed' : ''}" data-cat="${esc(k)}">
      <button class="wiki-cat-hd" data-cat-toggle="${esc(k)}" aria-expanded="${collapsed ? 'false' : 'true'}">
        <span class="wiki-cat-chevron" aria-hidden="true">▾</span>
        <span>${esc(catLabel(k))}</span>
        <span class="wiki-cat-count">${items.length}</span>
      </button>
      <div class="wiki-cat-items">`;
    for (const a of items) {
      html += `<a class="wiki-nav-item${a.id === currentId ? ' active' : ''}"
                  data-id="${esc(a.id)}" role="button" tabindex="0"
                  title="${esc(a.title)}">${esc(a.title)}</a>`;
    }
    html += `</div></div>`;
  }
  navEl.innerHTML = html;
  navEl.querySelectorAll('.wiki-nav-item').forEach(el => {
    el.addEventListener('click', () => navigate(el.dataset.id));
    el.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') navigate(el.dataset.id); });
  });
  navEl.querySelectorAll('[data-cat-toggle]').forEach(btn => {
    btn.addEventListener('click', () => toggleCat(btn.dataset.catToggle));
  });
}

// ── Replier / déplier une catégorie ───────────────────────────────────────
function toggleCat(catId){
  if (collapsedCats.has(catId)) collapsedCats.delete(catId);
  else collapsedCats.add(catId);
  const catEl = navEl.querySelector(`.wiki-cat[data-cat="${catId}"]`);
  if (catEl) {
    const collapsed = collapsedCats.has(catId);
    catEl.classList.toggle('collapsed', collapsed);
    const btn = catEl.querySelector('.wiki-cat-hd');
    if (btn) btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
  }
}

// ── Navigation vers un article ────────────────────────────────────────────
function navigate(id, pushState = true){
  const art = allArticles.find(a => a.id === id);
  if (!art) return;
  if (pushState && currentId && currentId !== id) history_.push(currentId);
  currentId = id;
  location.hash = id;
  renderArticle(art);
  // Déplier la catégorie de l'article et rafraîchir le nav (active + état replié)
  collapsedCats.delete(art.cat);
  renderNav();
  // Scroll nav item into view
  const active = navEl.querySelector('.wiki-nav-item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
  contentEl.scrollTop = 0;
  // (Le chargement des articles adossés à un markdown — CHANGELOG.md, INSTALL.md… — se fait dans
  // `renderArticle`, qui est le point de passage de TOUTES les voies de rendu, pas seulement de la
  // navigation.)
}

// ── Rendu d'un article ────────────────────────────────────────────────────
function renderArticle(art){
  let body;
  if (art.html) {
    // ⚠ UNE AIDE DANS UNE AUTRE LANGUE DOIT LE DIRE. Le repli sur `help.md` est
    // silencieux côté serveur ; sans ce bandeau, un article anglais dans une
    // interface française se lit comme un défaut de traduction du PRODUIT, alors
    // que c'est une doc de plugin que personne n'a encore traduite. On ne le dit
    // que si la langue servie est CONNUE et différente : le fichier générique ne
    // déclare pas la sienne, et l'accuser à tort serait pire que se taire.
    const ui = (window.LANG || 'fr');
    body = (art.docLang && art.docLang !== ui)
      ? `<p class="wiki-doc-lang">${esc(window.t('js.aide_doc_autre_langue')
           .replace('{l}', art.docLang.toUpperCase()))}</p>` + art.html
      : art.html;
  } else {
    const tpl = document.getElementById('wiki-art-' + art.id);
    body = tpl ? tpl.innerHTML : '<p>Contenu introuvable.</p>';
  }
  const verBadge = art.version
    ? `<span class="wiki-article-ver">v${esc(art.version)}</span>` : '';
  contentEl.innerHTML = `<div class="wiki-doc" id="wiki-doc">
    <article class="wiki-article">
      <div class="wiki-article-meta">
        <span class="wiki-article-cat">${esc(catLabel(art.cat))}</span>
        ${verBadge}
      </div>
      <h1>${esc(art.title)}</h1>
      ${body}
    </article>
    <nav class="wiki-toc" id="wiki-toc" aria-label="Sur cette page"></nav>
  </div>`;
  // Appliquer les classes wiki sur les divs aide-note / aide-warning injectées par plugins
  contentEl.querySelectorAll('.aide-note').forEach(el => { el.className = 'wiki-note'; });
  contentEl.querySelectorAll('.aide-warning').forEach(el => { el.className = 'wiki-warn'; });
  buildToc();
  // RÉ-HYDRATATION des articles adossés à un markdown (INSTALL.md, CHANGELOG.md…). Le corps vient
  // d'être RECRÉÉ depuis son <template> : il est donc revenu à « Chargement… ». Le remplissage doit
  // vivre ICI, seul point de passage obligé de toutes les voies de rendu — le brancher sur la
  // navigation seule laissait l'article se vider au retour, ou en effaçant la recherche
  // (`search('')` appelle renderArticle directement). Le conteneur déclare LUI-MÊME son document
  // (`data-doc`) : aucune table id d'article → nom de document à tenir à jour.
  contentEl.querySelectorAll('.wiki-doc-content[data-doc]').forEach(el => loadDoc(el.dataset.doc));
  if (contentEl.querySelector('#wiki-changelog-content')) loadChangelog();
}

// ── Table des matières « Sur cette page » ─────────────────────────────────
function slugify(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'sec';
}
function buildToc(){
  if (tocObserver){ tocObserver.disconnect(); tocObserver = null; }
  const doc = document.getElementById('wiki-doc'), tocEl = document.getElementById('wiki-toc');
  const article = doc && doc.querySelector('.wiki-article');
  if (!doc || !tocEl || !article) return;
  const heads = [...article.querySelectorAll('h2, h3')];
  if (heads.length < 2){ doc.classList.remove('has-toc'); tocEl.innerHTML = ''; return; }
  const used = new Set();
  for (const h of heads){
    let id = h.id || slugify(h.textContent);
    while (used.has(id)) id += '-x';
    used.add(id); h.id = id;
  }
  tocEl.innerHTML = `<div class="wiki-toc-hd">Sur cette page</div>` + heads.map(h =>
    `<a class="wiki-toc-item lvl-${h.tagName==='H3'?3:2}" href="#" data-tid="${esc(h.id)}">${esc(h.textContent)}</a>`).join('');
  doc.classList.add('has-toc');
  const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches, byId = {};
  tocEl.querySelectorAll('.wiki-toc-item').forEach(a => {
    byId[a.dataset.tid] = a;
    a.addEventListener('click', e => {
      e.preventDefault();
      const t = article.querySelector('#' + CSS.escape(a.dataset.tid));
      if (t) t.scrollIntoView({ behavior: smooth?'smooth':'auto', block:'start' });
    });
  });
  tocObserver = new IntersectionObserver(ents => {
    for (const en of ents){
      if (!en.isIntersecting) continue;
      tocEl.querySelectorAll('.wiki-toc-item.active').forEach(x => x.classList.remove('active'));
      const a = byId[en.target.id];
      if (a){ a.classList.add('active'); a.scrollIntoView({block:'nearest'}); }
    }
  }, { root: contentEl, rootMargin: '0px 0px -70% 0px', threshold: 0 });
  heads.forEach(h => tocObserver.observe(h));
}

// ── Recherche ─────────────────────────────────────────────────────────────
function search(q){
  q = q.trim();
  if (!q) {
    if (currentId) renderArticle(allArticles.find(a=>a.id===currentId)||allArticles[0]);
    else navigate(allArticles[0].id, false);
    return;
  }
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const scored = searchIndex.map(a => {
    const titleL = a.title.toLowerCase();
    const textL  = a.text.toLowerCase();
    let score = 0;
    for (const t of terms) {
      if (titleL.includes(t)) score += 10;
      if (textL.includes(t))  score += 1;
    }
    return { ...a, score };
  }).filter(a => a.score > 0).sort((a,b) => b.score - a.score);

  if (!scored.length) {
    contentEl.innerHTML = `<div class="wiki-no-results">Aucun résultat pour « ${esc(q)} »</div>`;
    return;
  }

  // Extraire un snippet avec contexte
  function snippet(text, query, len=160){
    const tl = text.toLowerCase();
    const ql = query.toLowerCase().split(/\s+/)[0];
    const idx = tl.indexOf(ql);
    const start = Math.max(0, idx - 60);
    const raw = text.slice(start, start+len).replace(/\s+/g,' ');
    return raw.replace(new RegExp('(' + ql.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi'),
                       '<mark>$1</mark>');
  }

  const items = scored.slice(0,20).map(a =>
    `<div class="wiki-result-item" data-id="${esc(a.id)}" role="button" tabindex="0">
      <div class="wiki-result-title">${esc(a.title)}</div>
      <div class="wiki-result-cat">${esc(a.catLabel)}</div>
      <div class="wiki-result-snippet">${snippet(a.text, q)}</div>
    </div>`
  ).join('');

  contentEl.innerHTML = `<div class="wiki-results">
    <div class="wiki-results-hd">${scored.length} résultat${scored.length>1?'s':''} pour « ${esc(q)} »</div>
    ${items}
  </div>`;

  function openResult(el){
    searchEl.value = '';
    kbdEl.style.opacity = '1';
    navigate(el.dataset.id);
  }
  contentEl.querySelectorAll('.wiki-result-item').forEach(el => {
    el.addEventListener('click', () => openResult(el));
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openResult(el); }
    });
  });
}

// ── Changelog ────────────────────────────────────────────────────────────
// ATTENTION : `renderArticle` RECRÉE le corps de l'article depuis son <template> à CHAQUE
// navigation — le conteneur rempli ici est donc détruit dès qu'on quitte l'article. Un simple
// drapeau « déjà chargé » faisait alors disparaître le contenu au retour (chargé une fois, jamais
// réinjecté). On mémorise donc le CONTENU, pas le fait de l'avoir chargé : une seule requête, mais
// une réinjection à chaque rendu.
let changelogCache = null;      // {html, mtime}
async function loadChangelog(){
  const target = document.getElementById('wiki-changelog-content');
  const mtime  = document.getElementById('wiki-changelog-mtime');
  if (!target) return;
  const poser = (c) => {
    target.innerHTML = c.html;
    if (mtime) mtime.textContent = new Date(c.mtime * 1000).toLocaleString('fr-FR');
  };
  if (changelogCache) { poser(changelogCache); return; }
  try {
    const r = await fetch('/api/changelog');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error||'erreur');
    changelogCache = { html: j.html, mtime: j.mtime };
    poser(changelogCache);
  } catch(e) {
    if (target) target.innerHTML = `<p style="color:var(--status-stopped-fg)">Erreur : ${e.message}</p>`;
  }
}

// ── Documents markdown de la racine (INSTALL.md, INFRASTRUCTURE.md…) ──────
// Même source que le dépôt : le fichier reste lisible sur GitHub, la page Aide
// l'affiche sans le dupliquer.
// Cache du CONTENU (et non un drapeau « déjà chargé ») : cf. `loadChangelog` — le conteneur est
// recréé à chaque navigation, il faut donc pouvoir le re-remplir sans refaire la requête.
const docCache = {};            // nom → {html, mtime}
async function loadDoc(name){
  const target = document.querySelector(`.wiki-doc-content[data-doc="${name}"]`);
  const mtime  = document.querySelector(`.wiki-doc-mtime[data-doc="${name}"]`);
  // Sans ce garde-fou bruyant, un nom qui ne correspond à aucun conteneur laissait l'article sur
  // « Chargement… » indéfiniment : l'échec ressemblait à une lenteur. C'est exactement ce qui est
  // arrivé à INSTALL.md, appelé « installation » alors que le conteneur portait « install ».
  if (!target) {
    console.error(`[aide] loadDoc("${name}") : aucun conteneur .wiki-doc-content[data-doc="${name}"]`);
    return;
  }
  const poser = (c) => {
    target.innerHTML = c.html;
    if (mtime) mtime.textContent = new Date(c.mtime * 1000).toLocaleString('fr-FR');
  };
  if (docCache[name]) { poser(docCache[name]); return; }
  try {
    const r = await fetch(`/api/doc/${name}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error||'erreur');
    docCache[name] = { html: j.html, mtime: j.mtime };
    poser(docCache[name]);
  } catch(e) {
    target.innerHTML = `<p style="color:var(--status-stopped-fg)">Erreur : ${e.message}</p>`;
  }
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchEl) {
    e.preventDefault();
    searchEl.focus();
    searchEl.select();
  }
  if (e.key === 'Escape' && document.activeElement === searchEl) {
    searchEl.value = '';
    search('');
    searchEl.blur();
    kbdEl.style.opacity = '1';
  }
  if (e.key === 'ArrowLeft' && (e.altKey || e.metaKey)) {
    if (history_.length) navigate(history_.pop(), false);
  }
});

searchEl.addEventListener('input', () => {
  kbdEl.style.opacity = searchEl.value ? '0' : '1';
  search(searchEl.value);
});

searchEl.addEventListener('focus', () => { kbdEl.style.opacity = '0'; });
searchEl.addEventListener('blur',  () => { if (!searchEl.value) kbdEl.style.opacity = '1'; });

// ── Init ─────────────────────────────────────────────────────────────────
buildIndex();
renderNav();

const startId = location.hash.slice(1) || 'vue-densemble';
const startArticle = allArticles.find(a => a.id === startId) || allArticles[0];
navigate(startArticle.id, false);

// Charger les plugins en arrière-plan (merge dans les catégories)
loadPluginArticles();

// Handle browser back/forward
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (id && id !== currentId) navigate(id, false);
});

})();
</script>
