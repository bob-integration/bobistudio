{% extends "layout.html" %}
{% set page = 'aide' %}
{% block title %}Documentation — Bobi.Studio{% endblock %}

{% block head %}
<style>
/* ── Wiki shell ──────────────────────────────────────────────────────────── */
.wiki-root {
  display: grid;
  grid-template-columns: 220px 1fr;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
.wiki-sidebar {
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.wiki-search-wrap {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.wiki-search {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 10px 6px 28px;
  color: var(--text);
  font-size: 0.83em;
  font-family: inherit;
  outline: none;
  transition: border-color 120ms;
  box-sizing: border-box;
}
.wiki-search:focus { border-color: var(--accent); }
.wiki-search::placeholder { color: var(--text-muted); }

.wiki-search-icon {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 0.85em;
  pointer-events: none;
}
.wiki-search-wrap { position: relative; }

.wiki-search-kbd {
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.68em;
  color: var(--text-muted);
  background: var(--bg-hover);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  font-family: var(--font-mono);
  pointer-events: none;
  transition: opacity 120ms;
}

.wiki-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0 16px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.wiki-nav::-webkit-scrollbar { width: 4px; }
.wiki-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* En-tête de catégorie repliable */
.wiki-cat {
  border-bottom: 1px solid var(--border-soft, var(--border));
}
.wiki-cat:last-child { border-bottom: none; }

.wiki-cat-hd {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 9px 14px;
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 0.7em;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  user-select: none;
  text-align: left;
  transition: color 100ms;
}
.wiki-cat-hd:hover { color: var(--text); }
.wiki-cat-hd:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.wiki-cat-chevron {
  font-size: 0.9em;
  transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1);
  flex-shrink: 0;
  opacity: 0.7;
}
.wiki-cat.collapsed .wiki-cat-chevron { transform: rotate(-90deg); }

.wiki-cat-count {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 0.92em;
  font-weight: 400;
  letter-spacing: 0;
  opacity: 0.55;
}

.wiki-cat-items {
  padding-bottom: 4px;
}
.wiki-cat.collapsed .wiki-cat-items { display: none; }

.wiki-nav-item {
  display: block;
  padding: 5px 14px 5px 28px;
  font-size: 0.82em;
  color: var(--text-muted);
  text-decoration: none;
  cursor: pointer;
  transition: background 80ms, color 80ms;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wiki-nav-item:hover { background: var(--bg-hover); color: var(--text); }
.wiki-nav-item.active {
  background: var(--bg-selected);
  color: var(--accent);
  font-weight: 500;
}
.wiki-nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* ── Content area ─────────────────────────────────────────────────────────── */
.wiki-content {
  overflow-y: auto;
  background: var(--bg);
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.wiki-content::-webkit-scrollbar { width: 6px; }
.wiki-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* .wiki-content reste le conteneur scrollable ; le padding vit sur .wiki-doc. */
.wiki-doc { padding: 32px 40px 60px; }
.wiki-doc.has-toc { display: grid; grid-template-columns: minmax(0, 980px) 200px; gap: 40px; }
.wiki-doc:not(.has-toc) .wiki-toc { display: none; }

.wiki-article {
  max-width: 980px;
}
.wiki-doc.has-toc .wiki-article { max-width: none; }

/* ── Table des matières « Sur cette page » (colonne droite sticky) ─────────── */
.wiki-toc {
  position: sticky;
  top: 24px;
  align-self: start;
  max-height: calc(100vh - 140px);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.wiki-toc-hd {
  font-size: .72em;
  font-weight: 600;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--text-muted);
  padding-bottom: 8px;
  margin-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.wiki-toc-item {
  display: block;
  padding: 4px 8px;
  font-size: .8em;
  line-height: 1.4;
  color: var(--text-muted);
  text-decoration: none;
  border-radius: var(--radius-small);
  transition: color 80ms, background 80ms;
}
.wiki-toc-item.lvl-3 { padding-left: 20px; font-size: .76em; }
.wiki-toc-item:hover { color: var(--text); }
.wiki-toc-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.wiki-toc-item.active { color: var(--accent); background: var(--bg-selected); font-weight: 500; }

.wiki-article-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
}
.wiki-article-cat {
  font-size: 0.72em;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-muted);
}
/* Aide de plugin servie dans une autre langue que l'interface. Discret : c'est
   une précision, pas une alerte — la doc est là et elle est lisible. */
.wiki-doc-lang {
  margin: 0 0 var(--space-3);
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-input);
  color: var(--text-muted);
  font-size: 0.85em;
}
.wiki-article-ver {
  font-family: var(--font-mono);
  font-size: 0.72em;
  color: var(--text-muted);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 6px;
}

.wiki-article h1 {
  font-size: 1.35em;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text-strong);
  margin: 0 0 20px;
  line-height: 1.25;
}
.wiki-article h2 {
  font-size: 0.95em;
  font-weight: 600;
  color: var(--text-strong);
  margin: 28px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.wiki-article h3 {
  font-size: 0.88em;
  font-weight: 600;
  color: var(--text);
  margin: 18px 0 8px;
}
.wiki-article p { margin: 0 0 12px; line-height: 1.6; font-size: 0.88em; color: var(--text); }
.wiki-article ul, .wiki-article ol { margin: 0 0 12px; padding-left: 22px; }
.wiki-article li { font-size: 0.88em; color: var(--text); margin-bottom: 4px; line-height: 1.5; }
.wiki-article code {
  font-family: var(--font-mono);
  font-size: 0.85em;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--text-strong);
}
.wiki-article pre {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px 14px;
  overflow-x: auto;
  margin: 0 0 14px;
  font-family: var(--font-mono);
  font-size: 0.82em;
  line-height: 1.5;
  color: var(--text);
}
.wiki-article pre code { background: none; border: none; padding: 0; font-size: 1em; }
.wiki-article table {
  border-collapse: collapse;
  margin: 0 0 14px;
  font-size: 0.85em;
  width: 100%;
}
.wiki-article th, .wiki-article td {

}
.wiki-article th { color: var(--text-muted); font-weight: 600; font-size: 0.88em; }
.wiki-article strong { color: var(--text-strong); }
.wiki-article a { color: var(--accent); text-decoration: none; }
.wiki-article a:hover { text-decoration: underline; }
.wiki-article blockquote {

.wiki-note {

  padding: 10px 14px;
  margin: 0 0 14px;
  font-size: 0.85em;
}
.wiki-warn {
  background: var(--status-warning-bg);

  border: 1px solid var(--border);
  border-radius: 4px;
  margin-bottom: 6px;
  cursor: pointer;
  background: var(--bg-elev);
  transition: border-color 100ms, background 100ms;
}
.wiki-result-item:hover { border-color: var(--accent); background: var(--bg-selected); }
.wiki-result-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.wiki-result-title {
  font-size: 0.88em;
  font-weight: 600;
  color: var(--text-strong);

.wiki-result-cat {

  color: var(--text-muted);

<template id="wiki-art-vue-densemble">
<p>Bobi.Studio orchestre un pool de <strong>conteneurs Docker</strong> répartis sur un ou plusieurs <strong>nœuds</strong>. Chaque conteneur héberge un script Python qui implémente un rôle broadcast : réception ST 2110, mixage multiview, émission ST 2110, encodage, enregistrement. L'orchestrateur expose une façade NMOS IS-04/IS-05 (de niveau cluster) pour les contrôleurs broadcast.</p>
<table>
<tr><th>Couche</th><th>Composant</th></tr>
<tr><td>Contrôleur</td><td>VSM ou autre — pilote via NMOS IS-04/05</td></tr>
<tr><td>Orchestrateur</td><td>Flask + SQLite. Gère conteneurs, nœuds, NMOS provider, Ember+. Peut tourner en paire HA (actif/standby)</td></tr>
<tr><td>Pipeline vidéo</td><td>Conteneurs Docker partageant la mémoire (<code>/dev/shm</code> / MXL) de leur nœud</td></tr>
<tr><td>Nœud</td><td>Hôte Docker piloté par un <em>agent de nœud</em> (jeton HTTP) — aucun accès SSH root requis</td></tr>
<tr><td>Infrastructure</td><td>NIC dédiée (PF E810, AF-XDP/DPDK) pour le 2110, PTP pour la synchro</td></tr>
</table>
<p>Les trois questions auxquelles l'interface répond en permanence :</p>
<ol>
<li><strong>Qu'est-ce qui tourne et est-ce nominal ?</strong> (surveillance)</li>
<li><strong>Pourquoi ça ne tourne plus ?</strong> (diagnostic)</li>
<li><strong>Comment configurer ou déployer ?</strong> (configuration)</li>
</ol>
</template>

<template id="wiki-art-cluster-architecture">
<p>L'orchestrateur a quitté le modèle Proxmox/LXC : il est aujourd'hui <strong>full-Docker</strong> et pensé pour un <strong>cluster de nœuds</strong>. Cet article résume l'architecture actuelle.</p>

<h2>Nœuds &amp; agent de nœud</h2>
<p>Un <strong>nœud</strong> est un hôte Docker. Il est piloté par un <strong>agent de nœud</strong> (daemon HTTP, port 9100, authentifié par jeton) qui gère le cycle de vie des conteneurs, la préparation hôte (Ethernet/SR-IOV/PTP/MTL, CPU) et le <em>build</em> d'images. Conséquence : <strong>aucun accès SSH root</strong> n'est requis depuis le contrôleur. Un nœud vierge s'enrôle depuis <strong>Réglages → Nœuds & Matériel → Déploiement</strong>.</p>

<h2>Identités NMOS de niveau cluster</h2>
<p>Les senders/receivers IS-04/05 vivent dans un <strong>registre de cluster</strong> (un Device unique), avec UUID/SDP/multicast/refclk <strong>persistés</strong>. Un recreate ou un restore de projet ne casse donc plus les abonnements des contrôleurs externes. Les flux d'un conteneur se <em>bindent</em> sur ces ressources (rebinding possible dans Réglages → NMOS) ; une ressource non servie reste exposée <strong>inactive</strong>.</p>

<h2>Réseau cluster</h2>
<p>Trois plans : <strong>management</strong>, <strong>conteneurs</strong> et <strong>ST 2110</strong>. La topologie est réglable (<em>Simple</em> = management + conteneurs sur un réseau ; <em>Séparé</em> = réseau conteneurs privé dédié). En multi-nœuds (ou mode séparé), l'<strong>allocation d'IP est centralisée</strong> (une IP stable par conteneur). Les flux 2110 sans adresse imposée tirent un groupe d'un <strong>pool multicast cluster-unique</strong>.</p>

<h2>Réglages par-nœud</h2>
<p>La préparation matérielle (Ethernet, SR-IOV, PTP, MTL, CPU) est <strong>par-nœud</strong> : un sélecteur de nœud coiffe les onglets <em>Réseau hôte</em>, <em>CPU</em> et <em>Déploiement → Local</em>. Le moniteur PTP échantillonne chaque nœud.</p>

<h2>Haute disponibilité (paire de contrôleurs)</h2>
<p>L'orchestrateur peut tourner en <strong>paire warm-standby</strong> : un <strong>actif</strong> pilote, un <strong>standby</strong> démarre passif (interface en lecture seule). L'actif <strong>réplique</strong> sa base vers le standby ; la <strong>bascule est manuelle</strong> (promouvoir/rétrograder), VIP de management déplacée à la main. Détails : voir le fichier <code>HA.md</code> et Réglages → Cluster & Réseau → Haute disponibilité.</p>

<div class="wiki-note">Les anciens articles « Pré-requis orchestrateur » et « Pré-requis containers LXC » décrivent le modèle Proxmox/LXC <strong>historique</strong> et ne s'appliquent plus.</div>
</template>

<template id="wiki-art-systeme-plugins">
<p>Bobi.Studio repose sur deux systèmes de plugins complémentaires.</p>

<h2>Container plugins — <code>plugins/&lt;type&gt;/</code></h2>
<p>Chaque type de conteneur Docker (2110_io, mixer, streamer…) est un plugin découvert au démarrage.</p>
<table>
<tr><th>Rubrique</th><th>Types</th></tr>
<tr><td>Sources</td><td><code>2110_io</code> (RX/TX ST 2110), <code>avsync</code>, <code>stream_in</code> (ingest SRT/UDP)</td></tr>
<tr><td>Traitements</td><td><code>mixer</code>, <code>multiview</code>, <code>color_corrector</code>, <code>split</code>, <code>udc</code>, <code>delay</code>, <code>pyramide</code> (proxies)</td></tr>
<tr><td>Streams</td><td><code>streamer</code></td></tr>
<tr><td>Médias</td><td><code>player</code>, <code>recorder</code>, <code>stills</code>, <code>transcoder</code></td></tr>
<tr><td>Dépannage</td><td><code>probe_2110</code> (sonde de conformité 2110)</td></tr>
</table>
<h3>Anatomie d'un container plugin</h3>
<ul>
<li><code>plugin.json</code> — manifeste : type, label, version, deploy_defaults, wiring, config_schema, nav, <code>control</code> (endpoints de contrôle + <code>read_endpoints</code>), <code>actions</code> (actions curatées), <code>param_tree</code> (paramètres réglables exposés aux macros)</li>
<li><code>script.py</code> — code Python déployé dans le container (template str.format)</li>
<li><code>help.md</code> — documentation (chargée dans cette page)</li>
<li>UI optionnelle : <code>control.html</code> / <code>control.js</code> / <code>control.css</code></li>
</ul>
<p>La version du manifeste est enregistrée par container déployé. Un drift de version est détecté et signalé dans la page Plugins.</p>
<h3>Exposer les capacités aux macros — obligatoire</h3>
<p><strong>Toute nouvelle fonction ou tout nouveau paramètre d'un plugin doit être exposé au système de macros/déclencheurs.</strong> Une capacité qui existe dans le conteneur mais qu'aucune surface de pilotage n'atteint est une fonction « morte » en production : l'opérateur ne peut ni la régler, ni l'automatiser, ni la conditionner. C'est une étape de la définition de « terminé », pas une option.</p>
<table>
<tr><th>Nature de la fonction</th><th>Où l'exposer</th></tr>
<tr><td>Paramètre continu réglable à chaud (position, opacité, gain, angle, bitrate…)</td><td><code>param_tree</code> du manifeste : arbre <em>élément → groupe → paramètre</em> typé et borné (bornes déclarées, ou lues dans <code>/state.caps</code>). L'éditeur de macros génère automatiquement les widgets.</td></tr>
<tr><td>Action discrète, chargement d'un fichier, pilotage d'état (start/stop, charger une image/clip, changer un texte, rappeler une mémoire)</td><td><code>actions[]</code> curatées : <code>endpoint</code> + <code>params</code> (avec <code>options_endpoint</code> pour les listes vivantes, <code>body</code> pour les champs fixes).</td></tr>
<tr><td>État à lire dans une condition/déclencheur</td><td>Le publier dans <code>/state</code> et ajouter le chemin à <code>control.read_endpoints</code>.</td></tr>
</table>
<div class="wiki-note"><strong>Réflexe PR</strong> : à chaque évolution d'un plugin, se demander « est-ce pilotable par macro ? ». Si non, ajouter <code>param_tree</code> / <code>actions</code> / publication <code>/state</code> avant de considérer la fonction livrée. Modèles de référence : <code>split</code> (param_tree riche + caps live), <code>mixer</code> (bornes déclarées + surcharge de chemin), <code>multiview</code> (paramètres par élément + actions horloge/texte).</div>
<h3>Métriques :8080 — champs attendus</h3>
<p>Le script expose un objet JSON sur <code>:8080</code>. Les champs suivants sont lus par l'orchestrateur :</p>
<table>
<tr><th>Champ</th><th>Type</th><th>Usage</th></tr>
<tr><td><code>fps</code></td><td>float</td><td>Cadence affichée dans le dashboard</td></tr>
<tr><td><code>frame_index</code></td><td>int</td><td>Write pointer shm (débit grains/s MXL)</td></tr>
<tr><td><code>inputs_latency_ms</code></td><td><code>{shm_name: ms}</code></td><td>Délai propre du module → badge <code>⧖ N ms</code> page Câbles</td></tr>
<tr><td><code>channels[{delay_ms}]</code></td><td>liste</td><td>Délai fixe (Delay, AV Sync) → idem badge ⧖, stocké sous clé <code>"*"</code></td></tr>
</table>
<div class="wiki-note"><strong>Implémenter <code>inputs_latency_ms</code></strong> : mesurer <code>ts_out − ts_in</code> en nanosecondes sur chaque trame traitée, convertir en ms, lisser sur une fenêtre glissante (≈ 30 frames). Modèle : <code>plugins/color_corrector/script.py</code> — classe <code>RollingMs</code>.</div>
<div class="wiki-note"><strong>Renommage d'un type</strong> : les containers existants sont migrés automatiquement au redémarrage. Les enregistrements NMOS restent stables (UUID basés sur le VMID).</div>

<h2>Services infrastructure — <code>services/&lt;nom&gt;/</code></h2>
<p>Les services qui tournent dans l'orchestrateur lui-même (protocoles, passerelles, stockage) suivent le même principe : chaque service vit dans un dossier autonome et est découvert au démarrage.</p>

<h3>Anatomie d'un service</h3>
<ul>

<template id="wiki-art-dev-orientation">
<p>Cet article s'adresse à quelqu'un qui vient de cloner le dépôt et cherche par où entrer. Il ne décrit pas ce que fait le produit — pour ça, voyez <em>Vue d'ensemble</em> et <em>Architecture cluster</em> — mais <strong>où vit le code</strong> et quelles règles y sont non négociables.</p>

<h2>La forme du dépôt</h2>
<p>Un <strong>orchestrateur Flask central</strong> (le contrôleur) pilote des <strong>nœuds</strong> Docker enrôlés qui exécutent les conteneurs de production. Le contrôleur n'exécute jamais de traitement vidéo : il décide, déploie et surveille.</p>
<p><code>main.py</code> à la racine est le point d'entrée ; tout le reste du code Python vit dans <code>app/</code>. Les <strong>plugins</strong> (un par type de conteneur) et les <strong>services</strong> (intégrations : NMOS, Ember+, TSL, SNMP…) sont des <strong>sous-modules git</strong> séparés, sous <code>plugins/</code> et <code>services/</code>.</p>
<table>
<tr><th>Chemin</th><th>Ce qu'on y trouve</th></tr>
<tr><td><code>app/routes.py</code>, <code>app/routes/</code></td><td>L'API REST. Point d'entrée unique par Blueprint — commencez ici pour remonter n'importe quel comportement de l'interface.</td></tr>
<tr><td><code>app/database.py</code></td><td>SQLite : schéma, migrations au démarrage, et <strong>tous</strong> les helpers <code>db_*</code>. Aucune requête SQL ne devrait vivre ailleurs.</td></tr>
<tr><td><code>app/plugins.py</code></td><td>Le registre des plugins : découverte, rendu du script, câblage déduit, hooks.</td></tr>
<tr><td><code>app/deploy.py</code></td><td>Le déploiement d'un conteneur, et les hooks bespoke par type.</td></tr>
<tr><td><code>app/node_driver.py</code></td><td>Le dialogue avec l'agent-nœud. Tout ce qui touche un nœud passe par là.</td></tr>
<tr><td><code>templates/</code>, <code>static/scripts.js</code></td><td>L'interface. Jinja2 + JS global, sans framework.</td></tr>
<tr><td><code>script_templates/bobimxl.py</code></td><td>Le binding du SDK MXL. C'est la bibliothèque que tout script de plugin utilise pour lire et écrire des images.</td></tr>
<tr><td><code>tools/verif_*.py</code></td><td>Les bancs de vérification. À lancer à la main, mais ce sont eux qui attrapent les régressions silencieuses.</td></tr>
</table>

<h2>Trois choses qui surprennent</h2>
<p><strong>Une bonne partie du code est en français.</strong> <code>detruire_container</code>, <code>redemarrer_container</code>, <code>surveillance</code>, et beaucoup de commentaires. C'est l'héritage d'un projet écrit par une équipe francophone, pas une exigence : le code plus récent — système de plugins, monitoring, passerelle, services — est en <strong>anglais</strong>, et c'est la direction prise.</p>
<p>La règle pratique tient en une phrase : <strong>écrivez comme le fichier autour de vous</strong>. Un correctif dans un module français garde ses noms français, pour ne pas laisser un fichier à moitié traduit — ce qui est pire que l'un ou l'autre. Un <strong>nouveau</strong> module, plugin ou service s'écrit en anglais. Personne n'a à parler français pour contribuer ici : <code>CONTRIBUTING.md</code> porte une <strong>table de correspondance</strong> des termes français vers leur équivalent anglais — un repère de lecture, explicitement pas une liste de renommages à faire. On ne renomme jamais un symbole au seul motif qu'il est en français. Si une explication en français vous bloque, ouvrez une <em>issue</em> — c'est un défaut de documentation, pas un pré-requis à remplir.</p>
<p><strong>Tout est asynchrone, et sérialisé par conteneur.</strong> Les routes Flask retournent immédiatement et dispatchent le travail dans un <code>threading.Thread</code>. Les opérations de cycle de vie — déployer, détruire, redémarrer, recréer, câbler, migrer — prennent un <strong>verrou par conteneur</strong> (<code>app/vmlocks.py</code>) dans le thread de fond : deux opérations sur le même conteneur s'attendent, deux conteneurs différents restent parallèles. Si vous ajoutez une opération de cycle de vie, prenez ce verrou.</p>
<p>Deux limites, l'une et l'autre délibérées. Le registre de verrous vit <strong>en mémoire du processus</strong> : un déploiement lancé ailleurs — script d'administration, ou le contrôleur de secours en haute disponibilité — lui est invisible. Ne vous fiez donc jamais au verrou seul, re-vérifiez <strong>l'état observé</strong> sous verrou plutôt que ce que la base affirme. Et le verrou <strong>dégrade au bout de 120 secondes</strong> : il alerte et exécute quand même, parce qu'abandonner silencieusement une destruction laisserait un état pire qu'une course.</p>
<p>Ce qui n'est pas protégé, en revanche : SQLite ouvre une connexion fraîche par appel, donc les écritures depuis les threads de fond sont sûres, mais <strong>il n'y a pas de transaction entre deux helpers</strong>.</p>
<p><strong>Aucun code de plugin ne tourne dans l'orchestrateur.</strong> C'est une règle de sécurité : les identifiants du contrôleur ne doivent pas pouvoir fuir. Le code d'un plugin ne s'exécute que dans son conteneur, via l'agent.</p>

<h2>L'identité d'un conteneur : trois barreaux</h2>
<p>C'est la distinction la plus utile du produit, et celle qu'on se trompe le plus souvent à choisir.</p>
<table>
<tr><th>Barreau</th><th>Survit à…</th><th>À utiliser pour</th></tr>
<tr><td><code>vmid</code></td><td>rien — réattribué, change au <em>recreate</em></td><td>chemins d'API internes, verrous, journaux. <strong>Jamais</strong> une adresse exposée à l'extérieur.</td></tr>
<tr><td><code>instance_uuid</code></td><td>recreate, restore, import de projet</td><td>NMOS, vues de projet, macros, liens publics.</td></tr>
<tr><td><strong>Emplacement</strong></td><td>le remplacement du conteneur lui-même</td><td>Identité <strong>fonctionnelle</strong> (« MULTIVIEW RÉGIE 1 »). C'est ce que doit adresser tout système de contrôle externe.</td></tr>
</table>
<p>Un lien public accroché au <code>vmid</code> a produit exactement le défaut prévisible : le vmid réattribué à un autre conteneur, et le vieux jeton ouvrait la page d'une autre machine. Choisissez le barreau avant d'écrire la clé étrangère.</p>

<h2>La boucle de surveillance</h2>
<p>Un thread démon interroge le parc toutes les 5 secondes : un conteneur dont le statut Docker n'est pas <code>running</code> est redémarré et une alerte est levée ; un conteneur <em>up</em> dont l'agent répond <code>running:false</code> reçoit un pseudo-statut <code>script_stopped</code>. Ajouter un statut implique d'ajouter son badge CSS — sans quoi il s'affiche sans style.</p>

<h2>Où est la documentation</h2>
<p>La racine du dépôt ne porte que de la documentation <strong>publique</strong> (<code>README</code>, <code>INSTALL</code>, <code>INFRASTRUCTURE</code>, <code>HA</code>, <code>NODE_AGENT</code>, <code>CONTRIBUTING</code>, <code>CHANGELOG</code>). Le reste est sous <code>docs/</code> : <code>docs/design/</code> pour la charte d'interface et la doctrine, <code>docs/reference/</code> pour les documents qui <strong>font foi</strong> (formats d'émission, horloge PTP, interopérabilité MXL, MIB SNMP), et <code>docs/chantiers/</code> pour les journaux datés, qu'on ne maintient pas.</p>
<div class="wiki-note">Un document rendu dans cette page d'aide doit aussi figurer dans la liste blanche de <code>app/builder.py</code>. Sinon il donne un 404 sur toute instance installée alors que tout fonctionne en développement.</div>
</template>

<template id="wiki-art-dev-plugin">
<p>Un plugin, c'est un <strong>type de conteneur</strong>. Trois fichiers suffisent : un manifeste, un script, et éventuellement une interface. Cet article décrit le contrat, et surtout les quatre règles qui font échouer un plugin <strong>en silence</strong> quand on les ignore.</p>

<h2>Anatomie</h2>
<table>
<tr><th>Fichier</th><th>Rôle</th></tr>
<tr><td><code>plugin.json</code></td><td>Le manifeste : <code>type</code>, <code>label</code>, <code>version</code>, <code>deploy_defaults</code>, <code>wiring</code> (ce que le plugin produit et consomme), <code>control.endpoints</code>, <code>config_schema</code>, et <code>nav</code> pour apparaître dans la palette.</td></tr>
<tr><td><code>script.py</code></td><td>Le code qui tourne <strong>dans le conteneur</strong>. Il embarque son propre serveur HTTP de métriques sur le port 8080.</td></tr>
<tr><td><code>control.js</code> / <code>control.css</code></td><td>La console de contrôle, optionnelle, montée par l'orchestrateur.</td></tr>
</table>
<p>Sans <code>nav</code>, le plugin est rendu et versionné mais n'émet ni chip de palette ni lien de navigation — c'est le cas des types à déploiement bespoke.</p>

<h2>⚠ Le piège des accolades</h2>
<p><code>script.py</code> n'est pas un module Python ordinaire : c'est un gabarit passé dans <code>str.format()</code>, avec seulement trois substitutions — <code>{config}</code>, <code>{hostname}</code> et <code>{plugin_version}</code>. <strong>Toute accolade littérale doit être doublée</strong> : dictionnaires, ensembles, f-strings, <em>et les commentaires</em>.</p>
<p>Le garde-fou fait un rendu à blanc au démarrage et <strong>écarte</strong> un plugin dont une accolade traîne. Conséquence à connaître : le plugin <em>disparaît du registre</em> au lieu de planter au déploiement. C'est nettement plus long à diagnostiquer si on ne s'y attend pas — et un banc a un temps annoncé « tout compile » alors qu'un plugin était écarté.</p>

<h2>⚠ Le mode tranche est obligatoire</h2>
<p>Tout <strong>nouveau</strong> plugin doit lire son entrée par tranches (<code>head_index</code> + <code>get_slice</code>, avec repli sur <code>get_latest</code> si la source n'est pas tranchée) et publier sa sortie en commit progressif. Le contrat : <em>k</em> tranches valides signifie que les lignes <code>[0, k × hauteur_de_tranche)</code> sont écrites <strong>sur les trois plans</strong>.</p>
<p>Pourquoi une règle et pas un réflexe : un plugin qui travaille en image entière ajoute <strong>une trame de latence</strong> à toute chaîne qui le traverse, et cette dette n'apparaît sur aucun compteur — le plugin affiche une cadence parfaite. L'instrument de mesure a été écrit en image entière, et il a fallu y revenir après coup ; le calcul restant après l'arrivée de la dernière ligne est passé de 5,09 à 1,48 ms.</p>
<p>Deux exceptions légitimes, à écrire dans le code : l'<strong>entrelacé</strong> et la <strong>sélection de ligne</strong> restent en image entière.</p>

<h2>⚠ Exposer les capacités aux macros</h2>
<p>Toute nouvelle fonction ou tout nouveau paramètre d'un plugin <strong>doit</strong> être pilotable par le système de macros et de déclencheurs. Sinon la capacité est morte : elle existe, elle marche à la main, et aucun automatisme ne peut l'atteindre. C'est un échec silencieux fonctionnel.</p>
<table>
<tr><th>Nature</th><th>Mécanisme</th></tr>
<tr><td>Paramètre continu réglable à chaud</td><td><code>param_tree</code> — arbre élément → groupe → paramètre typé et borné</td></tr>
<tr><td>Action discrète, chargement de fichier, rappel</td><td><code>actions[]</code>, avec <code>options_endpoint</code> pour les listes vivantes</td></tr>
<tr><td>État lisible en condition</td><td>publié dans <code>/state</code> et déclaré dans <code>control.read_endpoints</code></td></tr>
</table>

<h2>⚠ Publier ce qui rend le plugin observable</h2>
<p>Le port 8080 du conteneur doit rendre au minimum <code>{fps, frame_index}</code>. Au-delà, un plugin publie ce qui permet de savoir s'il fait <strong>ce qu'on lui a demandé</strong>, pas seulement s'il tourne. Une alarme qui dit « ça tourne » sans dire « ça fait ce qui était voulu » n'a pas de valeur — et un compteur parfait pendant que le résultat est faux est la panne la plus coûteuse du produit.</p>

<h2>Le contrat de l'agent, côté conteneur</h2>
<table>
<tr><th>Appel</th><th>Effet</th></tr>
<tr><td><code>POST :8081/deploy</code></td><td>écrit le script sur disque</td></tr>
<tr><td><code>POST :8081/start</code> · <code>/stop</code></td><td>contrôle le script</td></tr>
<tr><td><code>GET :8081/status</code></td><td><code>{running: bool}</code></td></tr>
<tr><td><code>GET :8080/</code></td><td>les métriques émises par le script lui-même</td></tr>
</table>
<p>Ces appels exigent un jeton d'agent : tout appel doit joindre les en-têtes fournis par l'orchestrateur. Un seul chemin sans en-tête, et le conteneur devient impilotable après redéploiement.</p>

<h2>Page publique</h2>
<p>Un plugin peut être exposé par un lien sans authentification. L'orchestrateur fait tout le travail ; le plugin n'a qu'à respecter le contrat : la fonction de montage honore la base d'API fournie — <strong>toutes</strong> les URL passent par une fonction unique, jamais un test par appel — et le manifeste déclare <code>ui.public_page</code>. L'orchestrateur <strong>refuse</strong> de créer un lien pour un plugin qui ne le déclare pas, plutôt que d'en livrer un qui échouerait en 401.</p>

<h2>Versionner et publier</h2>
<p>La version du manifeste est persistée avec le conteneur et exposée sur le port de métriques : elle dit quelle version tourne réellement. Incrémentez-la à chaque changement de comportement, sinon le parc devient indéchiffrable.</p>
<div class="wiki-note">Modèles à lire avant d'écrire : <code>color_corrector</code> pour l'entrée en tranches, <code>scope</code> pour l'accumulation par bandes et la page publique, <code>split</code> pour <code>param_tree</code> avec bornes vivantes, <code>multiview</code> pour les actions par élément.</div>
</template>

<template id="wiki-art-dev-service">
<p>Un <strong>service</strong> est une intégration : un protocole tiers, une passerelle, un canal de notification. Contrairement à un plugin, il tourne <strong>dans l'orchestrateur</strong>, pas dans un conteneur.</p>

<h2>Anatomie</h2>
<p>Un dossier sous <code>services/</code>, qui est un sous-module git, avec un <code>__init__.py</code> exposant un Blueprint <strong>auto-enregistré au démarrage</strong>, un <code>manifest.json</code> et, optionnellement, un <code>settings_tab.html</code>.</p>
<table>
<tr><th>Fichier</th><th>Rôle</th></tr>
<tr><td><code>__init__.py</code></td><td>Les routes et la logique. Importé par <code>from services import &lt;nom&gt;</code>.</td></tr>
<tr><td><code>manifest.json</code></td><td>Identifiant, libellé, version, capacités déclarées.</td></tr>
<tr><td><code>settings_tab.html</code></td><td>Le fragment Jinja agrégé par la page Réglages.</td></tr>
</table>

<h2>Ce qui tourne, et où</h2>
<p>Un service qui émet ou répond sur le réseau doit être démarré <strong>sous la garde du contrôleur actif</strong> : en paire haute disponibilité, le standby ne doit rien annoncer. La garde est doublée à dessein — le point de démarrage la vérifie, et le service la revérifie de son côté.</p>
<p>Accédez à la base par les helpers <code>db_*</code> de <code>app/database.py</code>, pas par du SQL brut : c'est là que vivent le schéma et ses migrations, et un service qui écrit sa propre requête finit désynchronisé du jour où une colonne bouge. Un import local <code>from app.database import …</code> en tête de fonction est le style de la maison.</p>

<h2>⚠ L'onglet de réglages a sa propre famille i18n</h2>
<p>La page Réglages agrège un <code>settings_tab.html</code> par service. Ces fichiers vivant dans des sous-modules, leurs textes sont <strong>invisibles</strong> quand on relit la page principale : une famille entière de traductions peut manquer sans que rien ne le signale. Deux services ont ainsi vécu longtemps sans aucune clé — 128 textes pour l'un d'eux.</p>
<p>Le libellé de l'onglet vient du manifeste : il est traduit <strong>centralement</strong> par convention de clé, sans toucher au manifeste du sous-module.</p>

<h2>Vérifier une interface, vraiment</h2>
<p>Un gabarit qui se lit bien ne prouve rien. Vérifiez sur la page <strong>rendue</strong>, et <strong>dans les deux langues</strong> : c'est le seul endroit où l'on voit une clé absente du catalogue, une chaîne JS mal échappée, ou un texte construit en JavaScript qui n'est jamais passé par le catalogue.</p>
<div class="wiki-note">Avant de créer un contrôle d'interface, cherchez-le dans le catalogue existant. Il contient déjà des rotatifs, des arcs gradués, des interrupteurs et des champs numériques. En recréer un produit deux composants qui divergent.</div>
</template>

<template id="wiki-art-dev-contribuer">
<h2>Les garde-fous</h2>
<p>Il n'y a ni build, ni <em>linter</em>, ni suite de tests configurée : un seul environnement virtuel à <code>./venv</code>, et <code>./venv/bin/python main.py</code> démarre tout. Ce qui tient lieu de filet, ce sont les vérifications ci-dessous — lancez-les avant de proposer un changement.</p>
<table>
<tr><th>Vérification</th><th>Ce qu'elle attrape</th></tr>
<tr><td><code>pyflakes</code></td><td>Les orphelins d'un retrait de code : import mort, symbole disparu, fonction redéfinie. À passer systématiquement après avoir supprimé quoi que ce soit.</td></tr>
<tr><td>Le scan des plugins</td><td>Un plugin écarté du registre pour une accolade non doublée, ou dont le script rendu ne compile pas.</td></tr>
<tr><td><code>tools/verif_*.py</code></td><td>Les bancs : délai d'étage, marque audio, format de sonde, cohérence des plugins rendus contre le registre.</td></tr>
<tr><td>La CI</td><td>Un import circulaire dans <code>app/</code>, et le scan des plugins. Deux barrières bloquantes, volontairement légères.</td></tr>
</table>
<p>Une règle qui vient de l'expérience : <strong>un banc qui ne peut pas échouer ne vérifie rien</strong>. Avant de faire confiance à une vérification, cassez délibérément ce qu'elle surveille et regardez-la échouer.</p>

<h2>Ce qui se casse en silence</h2>
<p>Les pannes coûteuses de ce produit ne lèvent pas d'exception. Un lecteur accroché à un flux détruit sert des images à index figé, sans erreur. Un plugin écarté du registre ne plante pas : il n'existe plus. Un plugin en image entière affiche une cadence parfaite tout en coûtant une trame à la chaîne. Une alerte stockée en français ne peut plus être traduite. À chaque fois, la question utile n'est pas « est-ce que ça tourne ? » mais <strong>« est-ce que ça fait ce qu'on a demandé ? »</strong>.</p>

<h2>Secrets et valeurs de site</h2>
<p>Aucune valeur propre à une installation n'est écrite en dur. Hôtes, jetons et secrets vivent dans <code>config_local.py</code> à la racine, qui n'est pas versionné ; <code>app/config.py</code> ne porte que des défauts neutres. Ne les recopiez nulle part, ne les journalisez pas.</p>

<h2>Clé SSH vers l'host Proxmox</h2>

<p>Test : <code>ssh -o BatchMode=yes root@&lt;proxmox-host&gt; "echo OK"</code> doit retourner <code>OK</code>.</p>
<h2>Settings au premier démarrage</h2>
<p>Onglet <strong>Réglages → Proxmox</strong> : adresse host, node, storage, template VMID (299 par défaut), plage VMID, plage IP, bridge réseau, VLAN tag.</p>

<div class="wiki-warn"><strong>Article historique (LXC)</strong> — les conteneurs tournent désormais en Docker sur des nœuds. Le template 299 et le contrat agent par-LXC ci-dessous ne s'appliquent plus. Voir <em>Architecture cluster</em>.</div>
<h2>Template LXC (VMID 299)</h2>
<p>Tous les containers sont clonés depuis le template 299. Pour le créer : <strong>Réglages → Proxmox → Recréer le template</strong>.</p>
<p>Le template installe : python3, python3-numpy, python3-pil, ffmpeg, ca-certificates. L'agent par-LXC est déployé et lancé via systemd.</p>

<template id="wiki-art-tsl-explique">
<p>Le service <strong>TSL 5.0</strong> centralise la réception des tallies depuis un contrôleur broadcast et les distribue à tous les containers multiview concernés.</p>
<h2>Principe</h2>
<p>Sans ce service, chaque multiview écoute son propre port TCP TSL — le contrôleur doit envoyer les mêmes tallies à <em>n</em> destinations. Avec le service central :</p>
<ol>
<li>Le contrôleur envoie les tallies sur <strong>un seul port TCP</strong> de l'orchestrateur</li>
<li>L'orchestrateur maintient un état tally global par <strong>index TSL</strong></li>
<li>À chaque changement, il pousse le tally vers les multiviews concernés via HTTP</li>
</ol>
<h2>Activer</h2>
<ol>
<li>Réglages → Protocoles → TSL → activer, choisir un port TCP (défaut 12345), Appliquer</li>
<li>Configurer le contrôleur VSM pour envoyer les tallies sur <code>IP-orchestrateur:12345</code></li>
</ol>
<h2>Mapping</h2>
<p>Dans le tableau <em>Mapping TSL → Multiviews</em> : associer chaque <strong>index TSL</strong> (numéro de source dans VSM) au container multiview et au numéro de flux vidéo (#0, #1…) qui doit recevoir ce tally. Un même index peut alimenter plusieurs multiviews.</p>
<h2>Mode orchestrateur dans le multiview</h2>
<p>Dans la palette de déploiement d'un multiview, cocher <em>« TSL géré par l'orchestrateur »</em> désactive le serveur TSL local du container. Le multiview reçoit ses tallies de l'orchestrateur uniquement, via <code>POST :8082/tally_bulk</code>.</p>
<div class="wiki-note">Le champ <em>Port TSL 5.0</em> du multiview est ignoré quand ce mode est actif.</div>
<h2>Protocole TSL 5.0</h2>
<table>
<tr><th>Champ CONTROL (bits)</th><th>Sens</th></tr>
<tr><td>0–1 : RH tally</td><td>0=off, 1=rouge, 2=vert, 3=ambre</td></tr>
<tr><td>2–3 : TT tally (label)</td><td>même codage</td></tr>
<tr><td>4–5 : LH tally</td><td>même codage</td></tr>
</table>
<p>Le service applique une logique <strong>dominante</strong> : rouge + vert simultanés → ambre. Il gère aussi les <strong>keepalives</strong> avec TTL adaptatif (mesuré sur l'intervalle des arrivées successives).</p>
<h2>Correspondance VSM typique</h2>
<table>
<tr><th>Signal VSM</th><th>Bits CONTROL</th><th>Couleur affichée</th></tr>
<tr><td>On-air (PGM)</td><td>TT=1 (rouge)</td><td>Rouge</td></tr>
<tr><td>Preview (PVW)</td><td>LH=2 (vert)</td><td>Vert</td></tr>
<tr><td>PGM + PVW</td><td>TT=1 + LH=2</td><td>Ambre</td></tr>
<tr><td>Extinction</td><td>CONTROL=0</td><td>Off (immédiat)</td></tr>
</table>
</template>

<template id="wiki-art-workflow-skaarhoj">
<p>Un pupitre Skaarhoj en <strong>Raw Panel</strong> déclenche des macros Bobi.Studio : chaque touche du pupitre est associée à une macro dans un <em>mapping</em>, et le mapping est affecté au pupitre.</p>

<div class="wiki-warn"><strong>Le sens de la connexion est l'inverse de l'ATEM.</strong> Pour un pupitre ATEM, c'est le pupitre qui vient chercher l'orchestrateur. Pour un Skaarhoj, <strong>c'est Bobi.Studio qui se connecte au pupitre</strong>. On ne donne donc pas l'adresse de Bobi.Studio au pupitre — on donne l'adresse <em>du pupitre</em> à Bobi.Studio. Se tromper de sens donne un pupitre qui affiche « Trying IP » en boucle pendant que l'orchestrateur, de son côté, tente une adresse qui ne répond pas : les deux appellent, personne ne décroche.</div>

<h2>Côté pupitre</h2>
<ol>
<li>Passer le pupitre en <strong>Raw Panel</strong>, et cocher <strong>« server mode »</strong> — le pupitre doit ÉCOUTER, pas composer une adresse.</li>
<li>Laisser le port par défaut : <strong>9923</strong>.</li>
<li>Relever l'adresse IP <em>du pupitre lui-même</em>.</li>
</ol>
<div class="wiki-warn">L'adresse IPv4 affichée par l'application <strong>Skaarhoj Updater</strong> est celle de l'ordinateur qui fait tourner l'Updater, pas celle du pupitre. Prendre l'adresse sur le pupitre, ou vérifier qu'elle répond au ping.</div>

<h2>Côté Bobi.Studio</h2>
<ol>
<li>Réglages → Pupitres → Skaarhoj → <strong>+ Ajouter un panel</strong></li>
<li>Renseigner l'<strong>IP du pupitre</strong> et le port 9923, cocher <em>activé</em></li>
<li>Créer un <strong>mapping</strong> (touche → macro) et l'affecter au panel</li>
</ol>
<p>La connexion est retentée <strong>toutes les 5 secondes</strong> tant qu'elle échoue, et le mapping est renvoyé au pupitre à chaque (re)connexion : débrancher puis rebrancher le réseau ne demande aucune intervention.</p>

<h2>« Connecté » ne veut pas dire « qui se comprend »</h2>
<p>Bobi.Studio ne lit qu'une seule chose : des lignes ASCII <code>HWC#&lt;numéro&gt;=&lt;valeur&gt;</code> terminées par un saut de ligne, et ne déclenche une macro que sur <code>=1</code> (l'appui ; le relâchement est ignoré). Tout le reste est ignoré silencieusement.</p>
<p>Conséquence à connaître avant de chercher ailleurs : si le pupitre est en mode <strong>binaire</strong> plutôt qu'en Raw Panel ASCII, la connexion TCP s'établit, l'état affiche <em>connecté</em>… et aucune touche ne fait rien. Le seul test qui prouve l'entente est <strong>d'appuyer sur une touche</strong> et de voir la macro partir.</p>

<h2>Diagnostic</h2>
<table>
<tr><th>Dans le journal</th><th>Ce que ça veut dire</th></tr>
<tr><td><code>connexion à &lt;ip&gt;:9923…</code> puis <code>connecté</code></td><td>Tout va bien côté transport.</td></tr>
<tr><td><code>erreur (Connection refused)</code></td><td>La machine est là mais rien n'écoute sur 9923 : « server mode » n'est pas coché, ou ce n'est pas le pupitre à cette adresse.</td></tr>
<tr><td><code>erreur (timed out)</code></td><td>Adresse injoignable : mauvais réseau, mauvaise IP, ou pupitre éteint.</td></tr>
<tr><td>Connecté, mais aucune macro</td><td>Le pupitre ne parle pas Raw Panel ASCII — cf. section ci-dessus.</td></tr>
</table>
</template>

<template id="wiki-art-sriov-explique">
<p>Le pipeline ST 2110 utilise la <strong>Physical Function (PF)</strong> de la carte E810 <strong>directement en AF-XDP</strong> (kernel-bypass DPDK via la Media Transport Library), avec le conteneur <code>2110_io</code> en <code>--network host</code>. Il n'y a <strong>plus</strong> de pool SR-IOV ni de VF allouée par conteneur (le modèle LXC SR-IOV a été retiré).</p>
<div class="wiki-note"><strong>Par-nœud</strong> : un moteur <code>2110_io</code> par nœud, sur la PF du nœud. Les cartes se déclarent via <em>Réglages → Réseau → Vue d'ensemble</em> (sélecteur de nœud en tête), en rôle <code>media2110</code>.</div>
<h2>Déclarer une NIC 2110</h2>
<p>Réglages → Réseau → Vue d'ensemble : régler l'interface en rôle <code>media2110</code>, lui donner <strong>une IP média</strong> (CIDR) et, pour le SMPTE 2022-7, l'appairer <strong>red/blue</strong> (deux ports = redondance <em>et</em> capacité). Cette IP est posée sur la PF (<code>ensure_media_ip</code>) au déploiement du moteur.</p>
<h2>PTP</h2>
<p>PTP tourne sur la/les PF <code>media2110</code> : un <code>ptp4l</code> multi-port (boundary clock JBOD) par domaine, BMCA unique, hardware timestamping (sub-µs) sur E810. Voir l'article PTP.</p>
<h2>Moteur MTL bi-rôle (2110_io) — Sorties TX</h2>
<p>Le moteur MTL fait simultanément réception (RX, réseau→shm) et émission (TX, shm→réseau) sur la même NIC E810. Chaque <strong>slot TX</strong> émet :</p>
<ul>
<li><strong>Vidéo 2110-20</strong> — câblé depuis la page Câbles (colonne Destinations)</li>
<li><strong>Audio 2110-30 #1 et #2</strong> — suit automatiquement le shm vidéo câblé (<code>host_0</code> → <code>host_audio_0/1</code>)</li>
<li><strong>ANC 2110-40</strong> — suit automatiquement le shm vidéo câblé (<code>host_0</code> → <code>host_anc_0</code>)</li>
</ul>
<p>Les destinations IP multicast sont auto-allouées au déploiement (plages <code>239.10.40-41.x</code> audio, <code>239.10.50.x</code> ANC). Elles sont modifiables à chaud via l'API <code>POST /api/mtl/&lt;vmid&gt;/tx/&lt;slot&gt;/dest</code> (paramètre <code>audio_idx</code> pour cibler le flux audio 0 ou 1). Les senders NMOS IS-04 correspondants (2110-30 ×2 + 2110-40 par slot) sont enregistrés automatiquement.</p>
<h2>Workflow</h2>
<ol>
<li>Réglages → Réseau → Vue d'ensemble — choisir le <strong>nœud</strong>, puis régler la PF E810 en rôle <code>media2110</code></li>
<li>Lui donner une <strong>IP média</strong> (CIDR) ; pour le 2022-7, appairer une seconde PF en red/blue</li>
<li>Activer le PTP sur la/les NIC <code>media2110</code> (Réglages → Réseau → PTP / Vue d'ensemble)</li>
<li>Déployer le moteur <code>2110_io</code> sur le nœud (Réglages → Déploiement → Nœuds → io2110) : l'IP média est posée sur la PF, le moteur tourne en <code>--network host</code> / AF-XDP</li>
</ol>
</template>

<template id="wiki-art-genlock">
<p>Toute la chaîne vidéo est <strong>genlockée</strong> : cadencée sur la même référence de temps (le
<a href="#ptp-explique">PTP</a>), de la source jusqu'à la sortie antenne, pour qu'aucune trame ne soit
dupliquée ni sautée et que les sources composées soient alignées à l'image près.</p>

<h2>Principe : genlock par propagation (latence minimale)</h2>
<p>On ne re-cadence PAS chaque étage sur la grille PTP — cela ajouterait <strong>une trame pleine de
latence par étage</strong>. On genlocke seulement aux <strong>frontières</strong> :</p>
<ul>
<li>la <strong>source</strong> (receiver ST 2110 / MTL) est déjà calée sur le PTP entrant ;</li>
<li>la <strong>sortie antenne</strong> (sender / MTL TX) émet sur la grille PTP.</li>
</ul>
<p>Entre les deux, chaque traitement <strong>se verrouille sur sa source</strong> et émet sa trame dès
le traitement terminé. La latence cumulée d'une chaîne (DVE + correcteur + mélangeur…) vaut donc la
<strong>somme des temps de traitement réels</strong> (souvent moins d'une trame), pas N trames.</p>
<div class="wiki-note">La grille PTP = <code>CLOCK_REALTIME</code>, disciplinée par <code>phc2sys</code>
depuis le PHC de la NIC. Un instant de grille = trame k à <code>round(k·1e9·den/num)</code> ns depuis
l'epoch.</div>

<h2>Gestion par type de module</h2>
<table>
<tr><th>Type de module</th><th>Mode de synchro</th></tr>
<tr><td>Source (receiver 2110 / MTL)</td><td>Ancre PTP : calée sur le flux 2110 entrant</td></tr>
<tr><td>Player, Mire A/V, Stills, Multiviewer, UDC</td><td>Sortie <strong>cadencée sur la grille PTP</strong> (générateurs &amp; convertisseur de cadence)</td></tr>
<tr><td>Correcteur de couleur, Delay</td><td><strong>Verrou d'entrée 1:1</strong> : 1 trame sortie par trame entrée (latence = traitement)</td></tr>
<tr><td>Mélangeur, DVE</td><td>Verrou sur une <strong>entrée de référence</strong> + alignement des autres entrées par media-timestamp</td></tr>
<tr><td>Enregistreur</td><td><strong>Frame-accurate</strong> : 1 trame fichier par trame source + plancher de cadence</td></tr>
<tr><td>Sortie antenne (sender / MTL TX)</td><td>Ancre PTP : émission sur la grille</td></tr>
</table>

<h2>Player : signal toujours stable</h2>
<p>Le player produit un signal <strong>continu</strong> dans tous les états — lecture, pause, freeze,
chargement, changement de clip — <strong>sans rupture ni saut de phase</strong>. Le calage
audio/vidéo est <strong>déterministe</strong> (verrou par media-timestamp), jamais réglé « à l'oreille ».</p>

<h2>Mélangeur &amp; DVE : entrée de référence + alignement</h2>
<p>Un mélangeur compose des trames du <strong>même instant</strong>. Il se verrouille sur une
<strong>entrée de référence</strong> — un <strong>choix opérateur</strong> (réglage <code>sync_ref</code>,
changeable à chaud), <strong>fixe</strong> : elle ne change PAS à la commutation PGM/PVW. Les autres
entrées sont alignées par media-timestamp dans une fenêtre réglable (<code>align_budget</code>, défaut
1 trame) :</p>
<ul>
<li>budget = 0 : on n'attend jamais (latence mini ; une source décalée peut être 1 trame « en retard ») ;</li>
<li>budget = N : on attend jusqu'à N trames que les sources en retard rattrapent l'instant de référence.</li>
</ul>
<p>Une source hors budget est présentée avec sa trame précédente (sans bloquer le programme) et
<strong>signalée</strong> (skew par entrée + alerte « en retard » dans les métriques). Le DVE suit le
même modèle, avec le <strong>fond</strong> comme référence (il ne commute pas).</p>

<h2>Cadences fractionnaires</h2>
<p>Les cadences <strong>fractionnaires</strong> (29.97, 59.94, 23.976) sont gérées nativement via une
grille <strong>rationnelle</strong> (num/den exact : 29.97 = 30000/1001, 59.94 = 60000/1001) — pas
d'approximation à 30/60. Les formats fractionnaires sont sélectionnables dans Réglages → Formats.</p>

<h2>Contrôle de format au câblage</h2>
<p>Câbler une source <strong>incompatible</strong> avec un consommateur (résolution, chroma ou cadence
différente) est <strong>refusé</strong> avec la raison et la solution (« insérer un UDC »), au lieu de
produire une image illisible. Les <strong>convertisseurs</strong> (UDC, Multiviewer) et les
consommateurs en auto-détection sont exemptés.</p>
<div class="wiki-note">Désactivable : Réglages → Formats → <em>Contrôle de format au câblage</em> (repasse
en simple avertissement). Chaque plugin a aussi un commutateur <code>genlock</code> (activé par défaut)
pour revenir au comportement horloge mur en cas de besoin.</div>

<h2>Suivi des temps de traitement (page Câbles)</h2>
<p>La page <strong>Câbles</strong> affiche les délais de traitement le long du pipeline — utile pour
caler un <strong>délai audio externe</strong> :</p>
<ul>
<li><strong>Carte module</strong> : badge <code>⧖ N ms</code> = délai de traitement <strong>propre</strong>
à ce module (son coût de traitement seul). Affiché uniquement si le module mesure sa propre latence
(correcteur de couleur, delay, AV sync, mélangeur, multiview…).</li>
<li><strong>Sortie</strong> : badge <code>Δ N ms</code> = délai de traitement <strong>cumulé</strong>
du signal le long de la chaîne. C'est le retard à compenser sur un audio externe pour rester synchrone.</li>
<li><strong>Câble</strong> : étiquette <code>+N ms</code> au milieu = délai <strong>ajouté</strong> par
ce saut (colorée par seuil). Le survol détaille la méthode de mesure.</li>
<li><strong>Entrées de mélangeur/DVE</strong> : le mélangeur aligne ses entrées sur une référence, donc
chaque entrée porte un badge — <strong>« réf »</strong> (immédiate, cadence le mix), <code>+N ms</code>
(alignée dans le budget) ou <strong>« attend ↺ »</strong> (image précédente, hors budget), + son délai
propre → on voit l'écart réconcilié.</li>
</ul>
<div class="wiki-note">Le délai mesuré est le <strong>temps de traitement MXL</strong> (moyenne
glissante), pas la latence de transport 2110 / encodage en aval.</div>
</template>

<template id="wiki-art-cables-page">
<p>La page <strong>Câbles</strong> est la vue de <strong>topologie</strong> du pipeline : chaque
container y est une carte, reliée à ses sources et destinations par les liaisons en mémoire
partagée (shm). C'est là qu'on <strong>câble</strong> les signaux et qu'on surveille
<strong>cadence</strong>, <strong>latence</strong> et <strong>tally</strong> d'un coup d'œil.</p>

<h2>Câbler un signal</h2>
<ul>
<li>Tirer un câble d'un <strong>port de sortie</strong> (à droite d'une carte) vers un
<strong>port d'entrée</strong> (à gauche d'une autre) — vidéo et audio ont des ports distincts.</li>
<li>Les sources réelles (RX 2110, générateurs) sont à gauche, les destinations (TX, streamer,
recorder) à droite ; les traitements s'intercalent au milieu.</li>
<li>Recâbler une entrée se fait <strong>à chaud, sans coupure ni redéploiement</strong> tant que
la nouvelle source a la même résolution (cf. <em>Changement de source à chaud</em>).</li>
</ul>

<h2>Voyant de signal</h2>
<p>Chaque port, en entrée comme en sortie, porte une <strong>pastille</strong> qui dit si un signal
y circule <em>en ce moment</em>. Elle se lit comme une lampe :</p>
<ul>
<li><strong>Disque de couleur, avec un halo</strong> — <strong>signal présent</strong>. La teinte
reste celle de l'essence (vidéo, audio, données) ; seule la lampe renseigne sur le signal.</li>
<li><strong>Disque gris, sans halo</strong> — <strong>pas de signal</strong>. Une lampe éteinte
reste une lampe : c'est une information, pas une absence d'information.</li>
<li><strong>Cercle creux en pointillé</strong> — <strong>état inconnu</strong>. Le producteur de ce
flux ne publie pas de quoi conclure. Rare, et volontairement distinct des deux autres.</li>
</ul>
<p>Les <strong>câbles</strong> suivent la même logique : un câble que rien ne traverse s'affiche
atténué et cesse de pulser.</p>

<div class="wiki-warn"><strong>Éteint ne veut pas dire cassé.</strong> Trois situations donnent une
lampe éteinte, et deux sont parfaitement normales : le port n'est <strong>pas câblé</strong> (cas
de l'immense majorité des entrées d'un moteur TX, qui en déclare 64) ; <strong>aucune session</strong>
ne l'alimente (les sorties audio et ANC d'un moteur 2110 tant qu'aucun receiver correspondant n'est
abonné) ; ou la source reçoit mais son image est <strong>noire ET figée</strong>, donc sans contenu.</div>

<h3>Pourquoi les ports non alimentés ne sont pas masqués</h3>
<p>Un port éteint reste <strong>câblable</strong>, et c'est délibéré : <strong>pré-câbler</strong>
avant que la source arrive est un usage normal. Le câble prend effet dès que le flux existe. Masquer
ces ports empêcherait de préparer une configuration ; ne rien afficher du tout laissait croire que
ces flux existaient — c'est ce qui faisait chercher, parfois longtemps, pourquoi un flux audio
n'arrivait jamais sur un autre nœud alors qu'il n'avait jamais été produit.</p>

<h3>Pourquoi une image noire et figée compte comme « pas de signal »</h3>
<p>Une entrée 2110 peut recevoir ses paquets à la cadence nominale tout en ne transportant rien :
tous les compteurs de transport sont au vert, et l'image est noire et immobile. Le voyant répond à
la question « <em>est-ce qu'il se passe quelque chose ?</em> », pas « <em>est-ce que le transport
fonctionne ?</em> » — cette dernière a déjà ses propres indicateurs (cadence, latence, badge
« ne reçoit pas »).</p>
<p>Les deux critères sont exigés <strong>ensemble</strong>. « Figé » seul est vrai de toute mire
fixe, qui est un signal valide ; « noir » seul peut être un noir voulu à l'antenne. Conséquence à
connaître : une source <strong>volontairement noire et immobile</strong> s'affichera éteinte.</p>

<div class="wiki-note">Le voyant décrit le <strong>flux</strong>, pas le container. Un module en
bonne santé qui ne reçoit rien aura des entrées éteintes — c'est l'information recherchée, pas une
contradiction.</div>

<h2>Filtres &amp; lisibilité</h2>
<p>Sur les topologies chargées, plusieurs outils réduisent le bruit :</p>
<ul>
<li><strong>Filtres</strong> par <strong>nœud</strong>, par <strong>type</strong> de container et
par <strong>version</strong> de plugin → n'afficher que ce qui compte.</li>
<li><strong>Repli</strong> (collapse) des cartes : réduire un container à son en-tête pour
dégager la vue.</li>
<li><strong>Vue libre zoomable</strong> : passer en disposition manuelle, déplacer les cartes,
<strong>zoom/pan</strong> ; la disposition est mémorisée d'une visite à l'autre.</li>
</ul>

<h2>Cadence (fps par flux)</h2>
<p>Chaque liaison affiche le <strong>fps</strong> du flux qui y circule (débit glissant ~1 s, pas
un cumul). Un flux qui décroche sous la cadence nominale saute immédiatement aux yeux —
utile pour repérer une source figée ou un module en sous-cadence.</p>

<h2>Les deux lignes d'avertissement sous une carte</h2>
<p>Une carte peut afficher, sous ses badges, une <strong>ligne en orange</strong> qui n'apparaît
que lorsqu'il y a quelque chose à signaler. Elles répondent toutes les deux à la même question&nbsp;:
<em>le chiffre de cadence affiché décrit-il vraiment ce qui sort d'ici&nbsp;?</em></p>

<h3><code>⚠ N img/s neuves seulement</code></h3>
<p>Ce module <strong>compose</strong> bien à sa cadence nominale, mais ses <strong>entrées</strong>
ne suivent pas&nbsp;: il recompose des images identiques. Il affiche 50&nbsp;img/s en toute honnêteté
— il travaille bien cinquante fois par seconde — mais il ne relaie de la matière neuve que N fois.
Un émetteur en aval, qui n'émet que sur changement, sortira à cette cadence-ci et pas à 50.</p>
<p><strong>Où chercher&nbsp;:</strong> chez les <strong>fournisseurs</strong> de ce module, pas chez
lui. Remonter les câbles vers la gauche jusqu'à trouver qui ne tient pas la cadence.</p>

<h3><code>⚠ shards à N img/s</code> (alignée à droite, sous le fps)</h3>
<p>Ce mur est <strong>découpé en shards</strong> par le tissu de composition&nbsp;: plusieurs
containers internes calculent chacun une région, et un <strong>assembleur</strong> les recompose.
La ligne donne la cadence du <strong>shard le plus lent</strong>, et son nom au survol.</p>
<p>Elle est placée juste sous le badge <code>fps</code> parce que les deux valeurs sont de même
nature et se lisent ensemble&nbsp;: en haut ce que l'assembleur <em>compose</em>, en dessous ce que
son maillon le plus lent lui permet de <em>relayer</em>. L'assembleur recompose à sa cadence
nominale quoi qu'il arrive — <strong>ce n'est donc pas un défaut de l'assembleur</strong>, et il ne
sert à rien de le redéployer. Mais il ne peut pas produire plus d'images neuves que le plus lent
de ses shards, et c'est cette valeur-là que voit l'aval.</p>
<p>Cette ligne existe parce que les shards sont <strong>volontairement repliés</strong> dans
l'interface&nbsp;: ce sont des rouages internes, on ne veut pas les voir en temps normal. Sans elle,
un mur dont un shard décroche s'afficherait à 50&nbsp;img/s, en pleine forme, et rien n'aurait
trahi la panne.</p>
<p><strong>Où chercher&nbsp;:</strong> le nom du shard est dans l'infobulle. Un shard qui décroche
est en général saturé (trop de fenêtres ou d'habillage dans sa région) ou en concurrence avec
d'autres containers sur les mêmes cœurs ou le même GPU. La page <strong>Monitoring</strong> donne
le détail par shard.</p>
<div class="wiki-note"><strong>Aucune tolérance.</strong> Ces avertissements ne reposent pas sur
un seuil d'écart&nbsp;: un seuil obligerait à répondre à « à partir de combien d'images perdues
est-ce grave&nbsp;?&nbsp;», question qui n'a pas de bonne réponse en broadcast. Le déclencheur est
le <strong>compteur de trames perdues</strong> que chaque producteur tient lui-même&nbsp;: zéro, ou
pas zéro. Pour les modules qui ne publient pas ce compteur, on retombe sur une comparaison
<strong>stricte</strong> à la cadence nominale — pas à celle de l'assembleur&nbsp;: une alarme se
compare à l'<em>intention</em>, sinon on compare un défaut à un autre défaut.
<br><br>La valeur retenue est le <strong>pire relevé des 30 dernières secondes</strong>. Une image
perdue il y a vingt secondes reste une image perdue&nbsp;; et sans cette fenêtre, l'avertissement
clignoterait au gré des oscillations normales de la mesure, au point qu'on cesserait d'y croire.</div>

<h2>Latence (badges ⧖ / Δ / +N ms)</h2>
<p>Le suivi des temps de traitement est détaillé dans l'article
<em>Synchronisation (Genlock)</em>. En résumé&nbsp;:</p>
<ul>
<li><code>⧖ N ms</code> sur une carte = délai de traitement <strong>propre</strong> au module.</li>
<li><code>Δ N ms</code> sur une sortie = délai <strong>cumulé</strong> depuis la source (à compenser
sur un audio externe).</li>
<li><code>+N ms</code> au milieu d'un câble = délai <strong>ajouté</strong> par ce saut.</li>
</ul>

<h2>Tally en direct</h2>
<p>Les ports de sortie portent des <strong>dots tally live</strong> : l'état tally (rouge
programme / vert preview…) de chaque source est reflété en temps réel sur la topologie,
au rythme des changements poussés par le <em>TSL centralisé</em> (cf. article TSL 5.0).</p>

<div class="wiki-note">La page se rafraîchit en continu : cadences, latences et tally sont des
mesures <strong>live</strong>, pas un instantané figé du déploiement.</div>
