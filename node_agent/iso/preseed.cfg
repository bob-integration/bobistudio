# Preseed Debian (bookworm/trixie) — installation NON INTERACTIVE d'un nœud Bobi.Studio.
# Injecté dans l'ISO netinst par build-node-iso.sh. Le late_command pose le payload node_agent +
# le service first-boot (bobi-node-bootstrap) qui provisionne le nœud au 1er démarrage.
# ⚠ Le partitionnement EFFACE LE DISQUE CIBLE sans confirmation (machine vierge attendue).

### Localisation / clavier (adapter au site)
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr
d-i time/zone string Europe/Paris
d-i clock-setup/utc boolean true

### Réseau (DHCP ; le hostname réel est fixé au 1er boot / enrôlement)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string bobi-node
d-i netcfg/get_domain string lan
d-i netcfg/hostname string bobi-node

### Miroir
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Composants apt : main + contrib + non-free + non-free-firmware
# Requis par la capacité `gpu` (pilote NVIDIA Debian) : nvidia-driver/nvidia-kernel-dkms sont en
# non-free, leurs deps nvidia-support/nvidia-installer-cleanup en contrib, et nvidia-kernel-dkms a
# un `Depends: firmware-nvidia-gsp (= <version>)` — dur et versionné — qui vit en non-free-firmware.
# Composant manquant = l'install du pilote échoue franchement. L'installateur trixie active
# non-free-firmware par défaut, mais on ne dépend pas d'un défaut d'installateur : on le déclare.
# Redondant AVEC (et non à la place de) la boucle d'activation de `provision_gpu()` dans
# install-node.sh, qui reste nécessaire pour les nœuds installés autrement (ISO d'un autre site,
# machine préexistante, rattrapage `--add-caps gpu`).
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true

### Comptes (mot de passe à changer ; clé SSH du contrôleur injectée par build-node-iso.sh)
d-i passwd/root-login boolean true
d-i passwd/root-password password bobi-changeme
d-i passwd/root-password-again password bobi-changeme
d-i passwd/make-user boolean false

### Partitionnement — disque entier, atomique (EFFACE TOUT)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/disk string /dev/sda /dev/nvme0n1 /dev/vda
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true

### Paquets de base (le reste — docker, linuxptp — est installé par install-node.sh au 1er boot)
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string python3 curl ethtool ca-certificates openssh-server vlan sudo
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Fin d'install non interactive
d-i finish-install/reboot_in_progress note

### ─── late_command : pose le payload + le service first-boot ───────────────────
# Le payload (node_agent/ + enroll.conf) est gravé sur l'ISO en /cdrom/bobi-node-src par
# build-node-iso.sh. On le copie dans le système installé et on active le oneshot.
d-i preseed/late_command string \
  mkdir -p /target/opt/bobi-node-src /target/etc/bobi-node /target/usr/local/sbin ; \
  cp -r /cdrom/bobi-node-src/. /target/opt/bobi-node-src/ ; \
  install -m 0755 /cdrom/bobi-node-src/node-bootstrap.sh /target/usr/local/sbin/bobi-node-bootstrap.sh ; \
  install -m 0755 /cdrom/bobi-node-src/install-node.sh /target/opt/bobi-node-src/install-node.sh ; \
  install -m 0600 /cdrom/bobi-node-src/enroll.conf /target/etc/bobi-node/enroll.conf ; \
  install -m 0644 /cdrom/bobi-node-src/bobi-node-bootstrap.service /target/etc/systemd/system/bobi-node-bootstrap.service ; \
  in-target systemctl enable bobi-node-bootstrap.service ; \
  if [ -f /cdrom/bobi-node-src/authorized_keys ]; then mkdir -p /target/root/.ssh ; cp /cdrom/bobi-node-src/authorized_keys /target/root/.ssh/authorized_keys ; chmod 600 /target/root/.ssh/authorized_keys ; fi
