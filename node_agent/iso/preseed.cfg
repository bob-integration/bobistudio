***REMOVED*** le service first-boot (bobi-node-bootstrap) qui provisionne le nœud au 1er démarrage.
***REMOVED*** ⚠ Le partitionnement EFFACE LE DISQUE CIBLE sans confirmation (machine vierge attendue).

