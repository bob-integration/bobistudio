***REMOVED******REMOVED******REMOVED*** Composants apt : main + contrib + non-free + non-free-firmware
***REMOVED*** Requis par la capacité `gpu` (pilote NVIDIA Debian) : nvidia-driver/nvidia-kernel-dkms sont en
***REMOVED*** non-free, leurs deps nvidia-support/nvidia-installer-cleanup en contrib, et nvidia-kernel-dkms a
***REMOVED*** un `Depends: firmware-nvidia-gsp (= <version>)` — dur et versionné — qui vit en non-free-firmware.
***REMOVED*** Composant manquant = l'install du pilote échoue franchement. L'installateur trixie active
***REMOVED*** non-free-firmware par défaut, mais on ne dépend pas d'un défaut d'installateur : on le déclare.
***REMOVED*** Redondant AVEC (et non à la place de) la boucle d'activation de `provision_gpu()` dans
