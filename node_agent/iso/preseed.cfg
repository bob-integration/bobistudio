***REMOVED*** machine préexistante, rattrapage `--add-caps gpu`).
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true

***REMOVED******REMOVED******REMOVED*** Comptes — clé SSH du contrôleur injectée par build-node-iso.sh (c'est ELLE qui sert à
***REMOVED******REMOVED******REMOVED*** l'exploitation ; le mot de passe root ne sert qu'à la console physique / iLO en cas de panne
***REMOVED******REMOVED******REMOVED*** réseau). @@ROOT_PASSWORD@@ est un MARQUEUR, pas une valeur : il est remplacé par un mot de passe
***REMOVED******REMOVED******REMOVED*** tiré au hasard au moment d'émettre le preseed — build-node-iso.sh pour l'ISO, app/pxe.py:preseed()
***REMOVED******REMOVED******REMOVED*** pour le PXE. Les deux REFUSENT d'émettre un preseed où le marqueur subsiste, plutôt que de livrer
***REMOVED******REMOVED******REMOVED*** un secret en dur. Ne jamais écrire de mot de passe littéral ici : ce fichier est versionné.
d-i passwd/root-login boolean true
d-i passwd/root-password password @@ROOT_PASSWORD@@
d-i passwd/root-password-again password @@ROOT_PASSWORD@@
d-i passwd/make-user boolean false

