# CI minimale bobistudio — garde-fous "gratuits" (pas de build/lint/test lourd).
# Gates BLOQUANTS : smoke import (circularités app/), scan des plugins (accolades
# non doublées). Étape ADVISORY (non bloquante) : doctor des sous-modules + pyflakes.
#
# NB sous-modules : ce sont 37 dépôts PRIVÉS, déclarés dans .gitmodules en **https**
# (https://github.com/bob-integration/…) — et c'est ce qui décide du mode d'accès :
#   un PAT org dans le secret SUBMODULES_TOKEN, passé à `actions/checkout` en `token`,
#   SUFFIT. L'action le réinjecte en en-tête HTTP, dont héritent les sous-modules.
#   AUCUNE clé SSH de déploiement n'est nécessaire. (Elle le serait pour des URL `git@`,
#   qu'un `token` ne couvre pas — ce fichier annonçait des URL SSH à tort jusqu'au
#   2026-10-25.) Le repli `github.token` ne porte que sur le dépôt courant.
# Sans credentials, le checkout des sous-modules échoue → les jobs dépendants
# (scan plugins) échoueront, ce qui est le comportement voulu (on veut le savoir).
# Mesuré : c'est exactement ce qui a tué les 8 runs du 2026-07-04, tous morts à l'étape
# de checkout, et ce que le secret a débloqué au premier run vert du 2026-10-25.
name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (avec sous-modules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Requiert un token capable de lire les dépôts privés bob-integration.
          # Repli sur GITHUB_TOKEN si le secret n'est pas défini (peut ne pas suffire
          # pour des sous-modules cross-repo privés).
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # liblilv : l'hôte de plugins tiers de la console audio la charge (dlopen) pour les vrais plugins LV2 —
          # tests/verif_console_plugins_lv2_state.py en compile un et ÉCHOUE sans elle (jamais vert à l'aveugle)
          sudo apt-get update -qq && sudo apt-get install -y -qq liblilv-0-0

      - name: Chemin d'installation (/opt/bobistudio)
        # L'app référence des chemins absolus /opt/bobistudio (LOG_PATH, DB_PATH).
        # On aligne le checkout dessus via un lien symbolique pour que `import main`
        # (qui pose le handler de log au chargement) fonctionne comme en prod.
        run: |
          sudo mkdir -p /opt
          sudo ln -sfn "$GITHUB_WORKSPACE" /opt/bobistudio

      - name: Base jetable pour la CI (jamais celle de la production)
        # `import main` n'est PAS inoffensif : main.py exécute au niveau module
        # `app.secret_key = _ensure_secret_key()`, qui appelle `init_db()` — donc le seul fait
        # d'importer FABRIQUE la base à l'emplacement de la production, et y écrit la clé
        # secrète. Mesuré au premier run vert de cette CI (2026-10-25, run 40187687253) : la
        # base était créée vide à l'étape de smoke import, et 24 tests rendaient ensuite un
        # verdict VERT en lisant une base vide — silencieux, donc pire qu'un échec.
        # `running_under_tests()` ne peut pas l'attraper : `sys.argv[0]` vaut "-c" ici.
        # On déplace donc la production elle-même, par le mécanisme de surcharge du produit
        # (`config_local.py`, non versionné, importé par app/config.py AVANT que
        # PRODUCTION_DB_PATH soit figé). L'import reste nu : aucune circularité n'est masquée.
        run: |
          # `>>` et non `>` : sur un checkout frais le fichier est absent (il est dans
          # .gitignore), et s'il existait on ne l'écraserait pas — `from config_local import *`
          # retient la DERNIÈRE affectation, donc la nôtre gagne de toute façon.
          printf 'DB_PATH = "%s/ci-bobistudio.db"\n' "$RUNNER_TEMP" >> config_local.py
          echo "DB_PATH de la CI : $(python -c 'from app import config; print(config.PRODUCTION_DB_PATH)')"

      - name: Smoke import (circularités app/)
        run: |
          python -c "import app.routes, app.plugins, app.database, app.deploy; print('app.* import OK')"
          python -c "import main; print('import main OK')"

      - name: Scan des plugins (accolades non doublées)
        run: python tests/check_plugins.py

      # Un plugin est un dépôt indépendant : ses libellés doivent VOYAGER AVEC LUI.
      # Une clé restée au catalogue du cœur est masquée pour l'auteur (le cœur prime)
      # et absente sur l'instance qui installe le plugin depuis le Catalogue — où
      # l'interface anglaise retombe alors sur le libellé français du manifeste.
      # Panne silencieuse : rien ne casse, la traduction disparaît simplement.
      - name: Portée des clés i18n (plugin vs cœur)
        run: python tests/check_i18n_scope.py

      # Le plugin d'EXEMPLE doit continuer d'illustrer le contrat qu'il enseigne.
      # Bloquant à dessein : une documentation que rien n'exécute dérive sans que
      # personne s'en aperçoive — c'est arrivé à plugins/AUTHORING.md, resté trois
      # mois à décrire un contrat qui avait changé sous lui.
      # Le dépôt est public : une adresse de notre réseau y est à la fois un renseignement
      # offert et un contresens pour le lecteur, qui croit lire un exemple reproductible.
      # Le nettoyage du 2026-09-01 en a retiré une vingtaine ; rien n'empêchait qu'elles
      # reviennent — elles arrivent naturellement, en collant dans un commentaire une adresse
      # relevée sur un banc. Les NOMS de machines restent autorisés (provenance de mesure).
      # ⚠ ABSENTE DU DÉPÔT PUBLIC, et c'est voulu : cette garde ÉNUMÈRE ce qu'on retire
      # (plages, domaine, noms de machines), donc la publier livrerait ce que le nettoyage
      # efface. L'étape se saute proprement quand le fichier n'est pas là, plutôt que de
      # faire échouer la CI du dépôt public sur un fichier manquant.
      - name: Adresses et machines du site
        run: |
          if [ -f tests/check_adresses_site.py ]; then
            python tests/check_adresses_site.py
          else
            echo "garde interne absente (dépôt dérivé) — étape sautée"
          fi

      - name: Conformité du plugin d'exemple (hello_world)
        run: python tests/verif_plugin_hello_world.py

      # ★ LA SUITE HORS LIGNE, EN BLOC. Elle a existé sans tourner nulle part : au
      # 2026-09-01, CINQ de ses fichiers échouaient depuis des semaines sans que personne le
      # sache — dont un qui masquait sa propre raison d'être (une assertion cassée coupait
      # avant la boucle `node --check`), et un autre qui exigeait un `systemctl enable`
      # RETIRÉ du produit parce qu'il avait causé une panne GPU de neuf jours. « Réparer »
      # le code pour satisfaire ce test aurait réintroduit le bug.
      #
      # Une suite qu'on n'exécute pas ne protège de rien, et se retourne contre celui qui
      # la croit verte. Elle tourne donc ici, en bloc et de manière BLOQUANTE.
      #
      # Ce qui n'y est PAS : `tools/bancs/`, qui exige un nœud, un orchestrateur ou des flux
      # MXL vivants — sans objet sur un exécuteur GitHub.
      - name: Suite hors ligne (tests/)
        run: |
          ec=0
          journal="$RUNNER_TEMP/suite.log"
          : > "$journal"
          lancer() {   # $1 = interpréteur, $2 = fichier
            echo "── $2"
            # La sortie passe par un FICHIER, jamais par un tube : `cmd | tee` rendrait le code
            # de `tee` et la suite paraîtrait verte quoi qu'il arrive.
            if "$1" "$2" > "$RUNNER_TEMP/un.log" 2>&1; then :; else
              echo "   ✗ ÉCHEC : $2"; ec=1
            fi
            cat "$RUNNER_TEMP/un.log"
            cat "$RUNNER_TEMP/un.log" >> "$journal"
          }
          for f in tests/*.py; do
            # `submodules-doctor` n'a plus à être exclu ici : c'est un .sh, hors du glob.
            case "$(basename "$f")" in __init__.py) continue ;; esac
            lancer python "$f"
          done
          for f in tests/*.js; do
            [ -e "$f" ] || continue
            lancer node "$f"
          done

          # ── Ce qui n'a PAS été mesuré ────────────────────────────────────────────────
          # Un banc qui s'abstient faute de root, de certificat ou d'un outil reste VERT : sans
          # ce récapitulatif, l'abstention devient une garde inerte que personne ne remarque.
          # On ne la transforme pas en échec (l'exécuteur n'y peut rien), on la rend LISIBLE.
          echo
          echo "── Contrôles NON MESURÉS sur cet exécuteur :"
          if grep -h "NON MESURÉ" "$journal" | sort -u | sed 's/^/   /' | grep .; then
            echo "   (total : $(grep -c "NON MESURÉ" "$journal") ligne(s))"
          else
            echo "   aucun — tout a été mesuré."
          fi

          # ── La base de production ne doit pas avoir été ouverte, même en lecture ─────
          # ⚠ On ne cherche pas « READ-ONLY » tout court : `verif_garde_base_prod` ouvre
          # EXPRÈS une fausse production sous /tmp (c'est son objet), et un banc peut imprimer
          # ces mots dans un libellé de contrôle — verif_lv2_plugins le fait. Les deux faisaient
          # échouer la suite à tort au run 40236890587. On ne retient que les ouvertures de LA
          # base désignée comme production ici, par son chemin exact.
          if grep -h "test opened the production database" "$journal" \
               | grep -F "$RUNNER_TEMP/ci-bobistudio.db" > "$RUNNER_TEMP/fuites.txt"; then
            echo
            echo "   ✗ des bancs ont ouvert la base de production de la CI :"
            sort -u "$RUNNER_TEMP/fuites.txt" | sed 's/^/     /'
            ec=1
          fi
          # Et rien ne doit avoir été créé à l'emplacement de la production du dépôt.
          if [ -e "$GITHUB_WORKSPACE/db_bobistudio.db" ]; then
            echo
            echo "   ✗ un fichier de base a été créé dans le dépôt : $GITHUB_WORKSPACE/db_bobistudio.db"
            ec=1
          fi
          exit $ec

      - name: Doctor des sous-modules (advisory)
        # actions/checkout laisse les sous-modules en HEAD détaché → la vérif de branche
        # remonte des faux positifs en CI. On l'exécute pour information seulement ;
        # la vérif de branche/propreté fait autorité en LOCAL (voir CONTRIBUTING.md).
        continue-on-error: true
        run: bash tests/submodules-doctor.sh

      - name: pyflakes (advisory)
        continue-on-error: true
        run: |
          pip install pyflakes
          pyflakes app main.py tools || true
